<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maqueta · Banda noche</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--p:#6105dc;--ink:#1c1830;--mut:#78729a;--f-head:'Plus Jakarta Sans',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:#e9e4f5;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
h3{margin:0}
.ic{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.bar{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;justify-content:space-between;padding:10px 20px;background:#1c1830;color:#fff;font-size:12.5px;position:sticky;top:0;z-index:50}
.bar b{font-family:var(--f-head);font-size:13.5px}
.bar .grp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bar .tog{display:inline-flex;background:rgba(255,255,255,.1);border-radius:999px;padding:3px}
.bar .tog button{color:#d9d2ee;padding:5px 13px;border-radius:999px;font-size:12px;font-weight:600}
.bar .tog button.on{background:#fff;color:#1c1830}
.stage{display:flex;flex-wrap:wrap;gap:26px;justify-content:center;align-items:flex-start;padding:26px 14px 40px}
.col{display:flex;flex-direction:column;gap:8px}
.etq{font-family:var(--f-head);font-weight:700;font-size:12.5px;color:#4d3f86;display:flex;gap:8px;align-items:center;padding-left:6px}
.etq i{font-style:normal;font-size:11px;padding:2px 9px;border-radius:999px;background:#fff;color:var(--mut)}
.etq i.n{background:var(--p);color:#fff}
.panelpos{background:#fff;border-radius:24px;padding:14px;box-shadow:0 30px 70px -22px rgba(60,20,120,.4)}
.g{display:grid;grid-template-columns:repeat(2,176px);gap:14px}

/* tarjeta publicada hoy */
.kc{position:relative;background:#fff;border-radius:26px;padding:8px;display:flex;flex-direction:column;gap:8px;box-shadow:0 0 0 1px #efe6fc,0 10px 24px -16px rgba(97,5,220,.28)}
.kc-fw{position:relative}
.kc-panel{position:relative;aspect-ratio:4/3.5;border-radius:20px;background:var(--t);overflow:hidden;display:flex;align-items:center;justify-content:center;padding-bottom:22px}
.kc-foto{width:78%;height:78%;display:flex;align-items:center;justify-content:center;mix-blend-mode:multiply}
.kc-foto svg{width:100%;height:100%}
.sin .kc-foto{opacity:.4;filter:grayscale(1)}
.kc-precio{position:absolute;top:0;right:0;background:#fff;padding:6px 4px 8px 12px;border-bottom-left-radius:18px;font-weight:800;font-size:16px;line-height:1;font-family:var(--f-head)}
.kc-precio small{font-size:10px;color:#78729a;margin-right:2px}
.kc-precio:before{content:"";position:absolute;right:100%;top:0;width:16px;height:16px;background:radial-gradient(circle at 0 100%,transparent 15.5px,#fff 16px)}
.kc-body{padding:0 4px 2px;display:flex;flex-direction:column;gap:7px}
.kc-body h3{font-family:var(--f-head);font-size:14px;font-weight:700;line-height:1.22;min-height:34px}
.chip{align-self:flex-start;font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--t);color:var(--td);display:inline-flex;align-items:center;gap:5px}
.chip i{width:6px;height:6px;border-radius:50%;background:#10b981}
.chip.bajo i{background:#f59e0b}.chip.sinc i{background:#f43f5e}
.chips{display:flex;flex-wrap:wrap;gap:5px}

/* banda actual: tira de color de lado a lado */
.kc-banda{position:absolute;left:0;right:0;bottom:0;height:24px;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--td);color:#fff;font-size:10.5px;font-weight:600;white-space:nowrap}
.kc-banda.warn{background:#b45309}.kc-banda.bad{background:#be123c}

/* banda integrada: pestaña blanca incrustada en el borde inferior de la foto (misma muesca que el precio) */
.integ .kc-panel{padding-bottom:20px}
.tab{position:absolute;left:50%;bottom:0;transform:translateX(-50%);display:flex;align-items:center;gap:5px;height:22px;padding:0 10px;border-radius:12px 12px 0 0;background:#fff;color:#1c1830;font-size:10.5px;font-weight:700;white-space:nowrap}
.tab .ic{font-size:10.5px;color:#e0a400}
.tab.warn{color:#b45309}.tab.warn .ic{color:#e8780a}
.tab.bad{color:#be123c}.tab.bad .ic{color:#e11d48}
.tab:before,.tab:after{content:"";position:absolute;bottom:0;width:12px;height:12px}
.tab:before{right:100%;background:radial-gradient(circle at 0 0,transparent 11.5px,#fff 12px)}
.tab:after{left:100%;background:radial-gradient(circle at 100% 0,transparent 11.5px,#fff 12px)}
</style>
</head>
<body>
<div class="bar">
  <b>Maqueta · Banda integrada blanca (POS)</b>
  <div class="grp"><span>Banda</span>
    <div class="tog" id="tog"><button data-v="noche" class="on">Integrada</button><button data-v="actual">Actual</button><button data-v="comparar">Comparar</button></div>
  </div>
</div>
<div class="stage" id="stage"></div>
<script>
const T={lila:['#ece0fd','#6a3fc4'],cielo:['#dfeafd','#3b66b8'],durazno:['#fde8d6','#c0662a'],menta:['#dcf3e6','#238458']};
const P=[
 {n:'AGUA CRISTALINA SIN GAS BOTELLA 500ML',c:'Bebidas Y Snacks',pr:'1.50',t:'durazno',f:'botella',s:'38 disp.',a:['star','Destacado en Delivery','']},
 {n:'CORONA BOTELLA (330ML) PACK X 6',c:'Cervezas',pr:'35.00',t:'lila',f:'galleta',s:'Quedan 4',e:'bajo',a:['alerta','Quedan 4','warn']},
 {n:'Leche evaporada 400 g',c:'Lácteos',pr:'4.90',t:'cielo',f:'lata',s:'Sin stock',e:'sinc',a:['alerta','Sin stock','bad'],sin:1},
 {n:'Manzana delicia',c:'Frutas',pr:'6.50',t:'menta',f:'manzana',s:'12 disp.'}
];
const IC={star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',alerta:'<path d="M12 4l9 16H3zM12 10v4M12 17.5v.01"/>'};
const ic=k=>`<svg class="ic" viewBox="0 0 24 24">${IC[k]}</svg>`;
function foto(k){const f={
 botella:'<rect x="52" y="14" width="16" height="9" rx="2.5" fill="#e11d48"/><path d="M54 23h12v14c0 4 11 8 11 18v44a6 6 0 0 1-6 6H49a6 6 0 0 1-6-6V55c0-10 11-14 11-18z" fill="#8ec5f0"/><rect x="43" y="62" width="34" height="24" fill="#fff" opacity=".92"/><rect x="49" y="69" width="22" height="3.5" rx="1.7" fill="#2f6fd0"/>',
 lata:'<rect x="38" y="24" width="44" height="82" rx="7" fill="#f3f6fc" stroke="#c9d4ea" stroke-width="1.5"/><rect x="38" y="48" width="44" height="34" fill="#3b6fd8"/><circle cx="60" cy="65" r="11" fill="#fff"/>',
 galleta:'<rect x="24" y="44" width="72" height="60" rx="6" fill="#d8a21f"/><rect x="24" y="44" width="72" height="9" rx="4" fill="#b8820f"/><circle cx="46" cy="30" r="8" fill="#2f9e5b"/><circle cx="60" cy="26" r="8" fill="#2f9e5b"/><circle cx="74" cy="30" r="8" fill="#2f9e5b"/>',
 manzana:'<path d="M60 36c-8-6-26-3-28 18-2 24 12 46 28 46s30-22 28-46c-2-21-20-24-28-18z" fill="#d92d3a"/><path d="M63 28c8-8 18-6 20-4-2 8-12 12-20 4z" fill="#3aa05c"/>'}[k];
 return `<svg viewBox="0 0 120 120"><rect width="120" height="120" fill="#fff"/><ellipse cx="60" cy="108" rx="30" ry="4.5" fill="#1c1830" opacity=".13"/>${f}</svg>`}
function card(p,noche){
  const [t,td]=T[p.t], a=p.a;
  const aviso=a?(noche?`<div class="tab ${a[2]}">${ic(a[0])}${a[1]}</div>`:`<div class="kc-banda ${a[2]}">${ic(a[0])}${a[1]}</div>`):'';
  return `<article class="kc ${noche?'integ':''} ${p.sin?'sin':''}" style="--t:${t};--td:${td}">
   <div class="kc-fw"><div class="kc-panel">${'<div class="kc-foto">'+foto(p.f)+'</div>'}${aviso}</div>
   <div class="kc-precio"><small>S/</small>${p.pr}</div></div>
   <div class="kc-body"><h3>${p.n}</h3><div class="chips"><span class="chip">${p.c}</span><span class="chip ${p.e||''}"><i></i>${p.s}</span></div></div></article>`}
function col(l,b,n,noche){return `<div class="col"><div class="etq">${l}<i class="${n?'n':''}">${b}</i></div><div class="panelpos"><div class="g">${P.map(p=>card(p,noche)).join('')}</div></div></div>`}
function render(v){document.getElementById('stage').innerHTML=v==='noche'?col('Banda integrada','propuesta',1,true):v==='actual'?col('Banda actual','en producción',0,false):col('Actual','hoy',0,false)+col('Integrada','propuesta',1,true)}
document.getElementById('tog').onclick=e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('#tog button').forEach(x=>x.classList.toggle('on',x===b));render(b.dataset.v)};
render('comparar');
</script>
</body>
</html>
