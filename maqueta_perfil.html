<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maqueta · Perfil</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--p:#6105dc;--p-dark:#4d04b0;--ring:#efe6fc;--ink:#1c1830;--mut:#78729a;--f-head:'Plus Jakarta Sans',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:#e9e4f5;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;justify-content:center;padding:24px 12px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
p,h1{margin:0}
.ic{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.tel{width:100%;max-width:390px;min-height:820px;border-radius:34px;overflow:hidden;position:relative;background:linear-gradient(180deg,#f1eafc 0,#f6f2fd 260px,#f5f4f8 100%);box-shadow:0 30px 60px -30px rgba(60,20,120,.45)}
.cab{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;padding:18px 16px 0}
.cab h1{text-align:center;font-size:15px;font-weight:700}
.atras{width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:0 1px 0 var(--ring);display:flex;align-items:center;justify-content:center;color:var(--p-dark);font-size:16px}
.yo{display:flex;flex-direction:column;align-items:center;padding:18px 16px 22px;text-align:center}
.av{width:78px;height:78px;border-radius:50%;padding:4px;background:#fff;box-shadow:0 8px 20px -10px rgba(97,5,220,.55)}
.av span{width:100%;height:100%;border-radius:50%;background:linear-gradient(135deg,#8a3df2,#4d04b0);color:#fff;font:800 30px var(--f-head);display:flex;align-items:center;justify-content:center}
.yo h2{margin:12px 0 0;font:800 24px var(--f-head);letter-spacing:-.4px}
.yo small{font-size:12.5px;color:var(--mut);margin-top:3px}
.yo em{font-style:normal;font-size:11.5px;font-weight:600;color:var(--p-dark);background:#fff;border-radius:999px;padding:4px 11px;margin-top:10px;box-shadow:0 1px 0 var(--ring)}
.hoja{background:#fff;border-radius:30px 30px 0 0;padding:14px 14px 40px;display:flex;flex-direction:column;gap:12px;min-height:560px;box-shadow:0 -10px 30px -22px rgba(97,5,220,.35)}
.banner{position:relative;overflow:hidden;border-radius:20px;padding:18px 16px;display:flex;align-items:center;gap:12px;color:#fff;text-align:left;background:linear-gradient(110deg,#4d04b0 0,#7a1cf0 55%,#c06bff 100%)}
.banner b{display:block;font:800 15px var(--f-head)}
.banner span{font-size:12px;opacity:.85}
.banner .txt{flex:1;position:relative;z-index:1}
.banner .go{position:relative;z-index:1;background:#fff;color:var(--p-dark);font-weight:700;font-size:12px;border-radius:999px;padding:8px 13px}
.banner i{position:absolute;border-radius:50%;background:rgba(255,255,255,.16)}
.banner i:nth-of-type(1){width:90px;height:90px;right:-18px;top:-30px}
.banner i:nth-of-type(2){width:54px;height:54px;right:60px;bottom:-26px;background:rgba(255,214,0,.35)}
.grupo{background:#f7f5fb;border-radius:20px;overflow:hidden}
.fila{display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%;text-align:left;position:relative}
.fila+.fila::before{content:"";position:absolute;left:46px;right:14px;top:0;height:1px;background:#ece6f6}
.fila .i{font-size:18px;color:#3b3552;width:22px;display:flex;justify-content:center}
.fila .t{flex:1;min-width:0}
.fila .t b{display:block;font-size:14px;font-weight:600}
.fila .t small{display:block;font-size:12px;color:var(--mut);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl{width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(60,20,120,.12);display:flex;align-items:center;justify-content:center;font-size:13px;color:#3b3552;flex-shrink:0}
.fl.lock{background:transparent;box-shadow:none;color:#a29cbd}
.sw{position:relative;width:44px;height:26px;border-radius:999px;background:#d9d5e2;flex-shrink:0;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--p)}
.sw.on::after{left:21px}
.salir{height:48px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1.5px #fecdd3;color:#e11d48;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px}
.elim{align-self:center;font-size:12.5px;font-weight:600;color:var(--mut);text-decoration:underline}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></symbol>
  <symbol id="phone" viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 18h2"/></symbol>
  <symbol id="mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></symbol>
  <symbol id="pin" viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.800 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></symbol>
  <symbol id="bell" viewBox="0 0 24 24"><path d="M6 17V11a6 6 0 1 1 12 0v6l1.500 2h-15Z"/><path d="M10 21h4"/></symbol>
  <symbol id="heart" viewBox="0 0 24 24"><path d="M12 20s-8-4.800-8-10.500A4.500 4.500 0 0 1 12 7a4.500 4.500 0 0 1 8 2.500C20 15.200 12 20 12 20Z"/></symbol>
  <symbol id="shield" viewBox="0 0 24 24"><path d="M12 3 5 6v5c0 4.500 3 8 7 10 4-2 7-5.500 7-10V6Z"/><path d="m9 12 2 2 4-4"/></symbol>
  <symbol id="doc" viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7Z"/><path d="M14 3v5h5M10 13h6M10 17h6"/></symbol>
  <symbol id="arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="back" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
  <symbol id="lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2.500"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
  <symbol id="out" viewBox="0 0 24 24"><path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4M15 8l4 4-4 4M19 12H9"/></symbol>
</svg>

<div class="tel">
  <div class="cab">
    <button class="atras" aria-label="Volver"><svg class="ic"><use href="#back"/></svg></button>
    <h1>Mi perfil</h1><span></span>
  </div>

  <div class="yo">
    <div class="av"><span>D</span></div>
    <h2>Diego</h2>
    <small>diego@gmail.com</small>
    <em>Cliente desde octubre de 2026</em>
  </div>

  <div class="hoja">
    <button class="banner">
      <i></i><i></i>
      <div class="txt"><b>Instala Kaserita</b><span>Pide más rápido, sin abrir el navegador</span></div>
      <span class="go">Instalar</span>
    </button>

    <div class="grupo">
      <button class="fila"><span class="i"><svg class="ic"><use href="#user"/></svg></span><span class="t"><b>Nombre</b><small>Diego Ramírez</small></span><span class="fl"><svg class="ic"><use href="#arrow"/></svg></span></button>
      <button class="fila"><span class="i"><svg class="ic"><use href="#phone"/></svg></span><span class="t"><b>Teléfono de contacto</b><small>987 654 321</small></span><span class="fl"><svg class="ic"><use href="#arrow"/></svg></span></button>
      <div class="fila"><span class="i"><svg class="ic"><use href="#mail"/></svg></span><span class="t"><b>Correo (Google)</b><small>diego@gmail.com</small></span><span class="fl lock"><svg class="ic"><use href="#lock"/></svg></span></div>
    </div>

    <div class="grupo">
      <button class="fila"><span class="i"><svg class="ic"><use href="#pin"/></svg></span><span class="t"><b>Mi dirección</b><small>Av. Los Olivos 123, frente al parque</small></span><span class="fl"><svg class="ic"><use href="#arrow"/></svg></span></button>
    </div>

    <div class="grupo">
      <div class="fila"><span class="i"><svg class="ic"><use href="#bell"/></svg></span><span class="t"><b>Estado de mis pedidos</b><small>Aviso cuando esté listo o en camino</small></span><span class="sw on"></span></div>
      <div class="fila"><span class="i"><svg class="ic"><use href="#heart"/></svg></span><span class="t"><b>Novedades de mis tiendas</b><small>Cuando abren o suman delivery</small></span><span class="sw"></span></div>
    </div>

    <div class="grupo">
      <a class="fila" style="text-decoration:none;color:inherit"><span class="i"><svg class="ic"><use href="#shield"/></svg></span><span class="t"><b>Política de privacidad</b></span><span class="fl"><svg class="ic"><use href="#arrow"/></svg></span></a>
      <a class="fila" style="text-decoration:none;color:inherit"><span class="i"><svg class="ic"><use href="#doc"/></svg></span><span class="t"><b>Términos y condiciones</b></span><span class="fl"><svg class="ic"><use href="#arrow"/></svg></span></a>
    </div>

    <button class="salir"><svg class="ic"><use href="#out"/></svg> Cerrar sesión</button>
    <button class="elim">Eliminar mi cuenta</button>
  </div>
</div>
<script>
document.querySelectorAll('.sw').forEach(s=>s.addEventListener('click',()=>s.classList.toggle('on')));
</script>
</body>
</html>
