<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maqueta · Historial (estilo Apple)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#6105dc; --accent-2:#8a3df2;
  --label:#1c1830; --label2:rgba(60,50,100,.62); --label3:rgba(60,50,100,.38);
  --sep:rgba(60,50,100,.12);
  --glass:rgba(255,255,255,.58); --glass-strong:rgba(255,255,255,.78); --glass-bd:rgba(255,255,255,.75);
  --ok:#17a566; --bad:#e5384f; --amber:#f59e0b;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter",system-ui,sans-serif;
  --spring:cubic-bezier(.32,1.2,.4,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0}
body{font-family:var(--font);color:var(--label);background:#d9d2ea;-webkit-font-smoothing:antialiased;min-height:100vh;letter-spacing:-.011em}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input{font:inherit;color:inherit}
.ic{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- barra de la maqueta ---- */
.bar{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;justify-content:space-between;padding:10px 20px;background:#1c1830;color:#fff;font-size:12.5px;letter-spacing:0}
.bar b{font-size:13.5px}
.bar .grp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bar .tog{display:inline-flex;background:rgba(255,255,255,.1);border-radius:999px;padding:3px}
.bar .tog button{color:#d9d2ee;padding:5px 13px;border-radius:999px;font-size:12px;font-weight:600}
.bar .tog button.on{background:#fff;color:#1c1830}
.bar .reset{border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:999px;padding:5px 13px;font-size:12px}

.stage{display:flex;justify-content:center;padding:26px 14px 44px;background:
  radial-gradient(60% 50% at 15% 10%,#c9b3ff 0%,transparent 60%),
  radial-gradient(50% 45% at 90% 20%,#ffc2dd 0%,transparent 60%),
  radial-gradient(55% 50% at 70% 95%,#b9d8ff 0%,transparent 60%),#e6dff5}

/* ---- ventana ---- */
.win{container-type:inline-size;container-name:w;position:relative;width:min(760px,100%);height:min(820px,calc(100vh - 118px));min-height:660px;border-radius:38px;overflow:hidden;isolation:isolate;
  background:linear-gradient(160deg,rgba(255,255,255,.55),rgba(250,246,255,.7));
  box-shadow:0 0 0 1px rgba(255,255,255,.6) inset,0 40px 90px -30px rgba(50,20,110,.55),0 8px 24px -10px rgba(50,20,110,.25);
  backdrop-filter:blur(40px) saturate(170%);-webkit-backdrop-filter:blur(40px) saturate(170%)}
.stage.mobile .win{width:390px;height:800px;border-radius:48px;border:9px solid #14111f}
.mesh{position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:
   radial-gradient(40% 30% at 8% 4%,rgba(138,61,242,.30),transparent 70%),
   radial-gradient(38% 30% at 96% 12%,rgba(255,122,184,.26),transparent 70%),
   radial-gradient(45% 35% at 80% 100%,rgba(90,170,255,.24),transparent 70%)}
.scroller{height:100%;overflow-y:auto;padding:26px 24px 120px;scroll-behavior:smooth}
.scroller::-webkit-scrollbar{width:0}

/* encabezado con título grande */
.top{display:flex;align-items:flex-start;gap:12px}
.top h1{margin:0;font-size:36px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.top p{margin:5px 0 0;font-size:15px;color:var(--label2);font-weight:500;letter-spacing:-.01em}
.top .grow{flex:1;min-width:0}
.gbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:18px;color:var(--label);
  background:var(--glass);border:1px solid var(--glass-bd);backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 6px 16px -8px rgba(50,20,110,.35);transition:transform .25s var(--spring)}
.gbtn:active{transform:scale(.92)}
.tbtns{display:flex;gap:8px;flex-shrink:0}

/* control segmentado con pastilla deslizante */
.seg{position:relative;display:flex;margin-top:18px;padding:3px;border-radius:999px;background:rgba(120,100,170,.14);box-shadow:inset 0 1px 2px rgba(50,20,110,.1)}
.seg .th{position:absolute;top:3px;bottom:3px;left:3px;border-radius:999px;background:#fff;box-shadow:0 3px 10px -2px rgba(50,20,110,.3),0 0 0 .5px rgba(50,20,110,.08);transition:transform .45s var(--spring),width .45s var(--spring)}
.seg button{position:relative;z-index:1;flex:1;height:34px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--label2);transition:color .2s}
.seg button.on{color:var(--label)}
.dates{display:flex;gap:10px;align-items:center;margin-top:12px;justify-content:center}
.dates input{height:38px;border-radius:12px;border:1px solid var(--glass-bd);background:var(--glass-strong);padding:0 12px;font-size:14px;outline:0;box-shadow:inset 0 1px 0 #fff}
.dates input:focus{box-shadow:0 0 0 3px rgba(97,5,220,.2)}
.dates span{color:var(--label2);font-size:14px}

/* tarjetas de cristal */
.cards{display:grid;grid-template-columns:1.15fr 1fr;gap:12px;margin-top:18px}
.card{position:relative;border-radius:28px;padding:20px;background:var(--glass);border:1px solid var(--glass-bd);
  backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.3),0 14px 34px -18px rgba(50,20,110,.4)}
.card.wide{grid-column:1/-1}
.eyebrow{font-size:13px;font-weight:600;color:var(--label2);letter-spacing:-.005em;display:flex;align-items:center;gap:7px}
.eyebrow .ic{font-size:14px}
.big{font-size:56px;font-weight:700;letter-spacing:-.045em;line-height:1;margin:10px 0 4px;font-variant-numeric:tabular-nums}
.big small{font-size:26px;font-weight:600;color:var(--label3);margin-right:4px;letter-spacing:-.02em}
.big sup{font-size:26px;font-weight:600;color:var(--label3);vertical-align:baseline;letter-spacing:-.02em}
.sub2{font-size:14px;color:var(--label2);font-weight:500}
.mini{display:flex;gap:18px;margin-top:16px;padding-top:14px;border-top:1px solid var(--sep)}
.mini div span{display:block;font-size:12px;font-weight:600;color:var(--label3)}
.mini div b{display:block;font-size:18px;font-weight:700;letter-spacing:-.025em;margin-top:2px;font-variant-numeric:tabular-nums}
.mini .ok b{color:var(--ok)}

/* anillo de medios de pago */
.ringwrap{display:flex;align-items:center;gap:16px;margin-top:10px}
.ring{position:relative;width:120px;height:120px;flex-shrink:0}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:13;stroke-linecap:round;transition:stroke-dasharray .7s var(--spring),stroke-dashoffset .7s var(--spring)}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .c b{font-size:26px;font-weight:700;letter-spacing:-.04em;line-height:1}
.ring .c span{font-size:11px;font-weight:600;color:var(--label3);margin-top:2px}
.leg{flex:1;min-width:0;display:grid;gap:7px}
.leg div{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.leg i{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.leg span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leg b{color:var(--label2);font-weight:600;font-variant-numeric:tabular-nums}

/* ventas por hora */
.bars{display:flex;align-items:flex-end;gap:7px;height:96px;margin-top:14px}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;align-items:center;gap:5px}
.bars .b i{display:block;width:100%;min-height:6px;border-radius:7px;background:rgba(97,5,220,.2);transition:height .6s var(--spring)}
.bars .b.pk i{background:linear-gradient(180deg,var(--accent-2),var(--accent))}
.bars .b span{font-size:10.5px;font-weight:600;color:var(--label3)}
.peak{font-size:13px;color:var(--label2);margin-top:10px}
.peak b{color:var(--label);font-weight:700}

/* lista agrupada */
.sec{margin:26px 4px 8px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.03em}
.sec span{font-size:14px;color:var(--label2);font-weight:500}
.group{border-radius:26px;background:var(--glass-strong);border:1px solid var(--glass-bd);overflow:hidden;
  box-shadow:inset 0 1px 0 #fff,0 12px 30px -18px rgba(50,20,110,.35)}
.row{display:flex;align-items:center;gap:13px;width:100%;padding:12px 16px 12px 14px;text-align:left;position:relative;transition:background .15s}
.row:hover{background:rgba(97,5,220,.045)}
.row:active{background:rgba(97,5,220,.09)}
.row + .row::before{content:"";position:absolute;top:0;left:68px;right:0;height:1px;background:var(--sep)}
.pmi{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:#fff;font-size:19px;flex-shrink:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 4px 10px -4px rgba(0,0,0,.3)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:16px;font-weight:600;letter-spacing:-.018em;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t span{display:block;font-size:13.5px;color:var(--label2);margin-top:1px;font-weight:500}
.row .r{text-align:right;flex-shrink:0}
.row .r b{display:block;font-size:16.5px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.row .r span{display:block;font-size:12.5px;color:var(--label3);margin-top:1px;font-weight:500}
.row .chev{color:var(--label3);font-size:14px;margin-left:-4px}
.row.anul .t b,.row.anul .r b{text-decoration:line-through;color:var(--label3)}
.row.anul .pmi{filter:grayscale(.8) opacity(.6)}
.pill{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 8px;background:rgba(229,56,79,.12);color:var(--bad);margin-left:6px;vertical-align:1px;letter-spacing:0}

.empty{text-align:center;padding:50px 20px;color:var(--label2);font-size:15px;line-height:1.45}
.empty .eico{width:76px;height:76px;border-radius:26px;margin:0 auto 14px;display:grid;place-items:center;font-size:34px;color:var(--accent);background:rgba(97,5,220,.1)}
.empty b{display:block;font-size:20px;color:var(--label);letter-spacing:-.025em;margin-bottom:3px}

/* barra de búsqueda flotante */
.dock{position:absolute;left:0;right:0;bottom:0;padding:34px 20px 20px;pointer-events:none;z-index:5;
  background:linear-gradient(to top,rgba(246,241,255,.95) 30%,rgba(246,241,255,0))}
.dockin{display:flex;gap:10px;pointer-events:auto;align-items:center}
.sbar{flex:1;display:flex;align-items:center;gap:10px;height:52px;padding:0 18px;border-radius:999px;background:var(--glass-strong);border:1px solid var(--glass-bd);
  backdrop-filter:blur(26px) saturate(190%);-webkit-backdrop-filter:blur(26px) saturate(190%);box-shadow:inset 0 1px 0 #fff,0 14px 30px -12px rgba(50,20,110,.45);transition:box-shadow .25s}
.sbar:focus-within{box-shadow:inset 0 1px 0 #fff,0 0 0 3px rgba(97,5,220,.25),0 14px 30px -12px rgba(50,20,110,.45)}
.sbar .ic{font-size:18px;color:var(--label3)}
.sbar input{flex:1;min-width:0;border:0;background:none;outline:0;font-size:16.5px;letter-spacing:-.015em}
.sbar input::placeholder{color:var(--label3)}
.fbtn{position:relative;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:var(--glass-strong);border:1px solid var(--glass-bd);
  backdrop-filter:blur(26px) saturate(190%);-webkit-backdrop-filter:blur(26px) saturate(190%);box-shadow:inset 0 1px 0 #fff,0 14px 30px -12px rgba(50,20,110,.45);transition:transform .25s var(--spring)}
.fbtn:active{transform:scale(.93)}
.fbtn .dotn{position:absolute;top:9px;right:9px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid #fff}

/* menú desplegable */
.menu{position:absolute;right:20px;bottom:84px;z-index:20;min-width:236px;padding:8px;border-radius:24px;background:rgba(252,250,255,.82);border:1px solid var(--glass-bd);
  backdrop-filter:blur(34px) saturate(190%);-webkit-backdrop-filter:blur(34px) saturate(190%);box-shadow:inset 0 1px 0 #fff,0 24px 60px -18px rgba(30,10,80,.55);transform-origin:bottom right;animation:pop .35s var(--spring)}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
.menu h4{margin:6px 12px 4px;font-size:12px;font-weight:600;color:var(--label3)}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:14px;font-size:15.5px;font-weight:500;text-align:left;letter-spacing:-.015em}
.mi:hover{background:rgba(97,5,220,.08)}
.mi .ck{margin-left:auto;color:var(--accent);font-size:15px;opacity:0}
.mi.on .ck{opacity:1}
.mi .d{width:10px;height:10px;border-radius:50%}
.mi .n{margin-left:auto;color:var(--label3);font-size:13px}
.mi.on .n{margin-right:2px}
.mi .n + .ck{margin-left:6px}
.menu hr{border:0;height:1px;background:var(--sep);margin:6px 8px}

/* hoja inferior con la boleta */
.scrim{position:absolute;inset:0;z-index:30;background:rgba(25,12,60,.28);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:fade .3s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:31;max-height:92%;border-radius:34px 34px 0 0;display:flex;flex-direction:column;
  background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(247,242,255,.94));border:1px solid var(--glass-bd);border-bottom:0;
  backdrop-filter:blur(40px) saturate(190%);-webkit-backdrop-filter:blur(40px) saturate(190%);box-shadow:inset 0 1px 0 #fff,0 -30px 80px -20px rgba(30,10,80,.5);
  animation:up .5s var(--spring)}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet .grab{width:38px;height:5px;border-radius:9px;background:rgba(60,50,100,.22);margin:9px auto 4px;flex-shrink:0}
.sheet .sc{overflow-y:auto;padding:6px 22px 30px;flex:1;min-height:0}
.sheet .sc::-webkit-scrollbar{width:0}
.sh-top{display:flex;align-items:center;gap:8px;margin:4px 0 6px}
.sh-top .spacer{flex:1}
.hero{text-align:center;padding:6px 0 18px}
.hero .pmi{width:62px;height:62px;border-radius:20px;font-size:28px;margin:0 auto 12px}
.hero .amt{font-size:52px;font-weight:700;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
.hero .amt small{font-size:24px;font-weight:600;color:var(--label3);margin-right:3px}
.hero.anul .amt{text-decoration:line-through;color:var(--label3)}
.hero p{margin:8px 0 0;font-size:15px;color:var(--label2);font-weight:500}
.hero .st{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:700;background:rgba(23,165,102,.12);color:var(--ok)}
.hero .st.bad{background:rgba(229,56,79,.12);color:var(--bad)}
.lg{border-radius:22px;background:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.9);overflow:hidden;margin-bottom:12px;box-shadow:0 8px 24px -16px rgba(50,20,110,.3)}
.li{display:flex;align-items:baseline;gap:12px;padding:13px 16px;font-size:15.5px;position:relative;letter-spacing:-.015em}
.li + .li::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--sep)}
.li .k{color:var(--label2);font-weight:500}
.li .v{margin-left:auto;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.li .v small{display:block;font-weight:500;color:var(--label3);font-size:12.5px}
.li.it .q{font-weight:700;color:var(--accent);min-width:28px}
.li.it .d{flex:1;min-width:0}
.li.it .d small{display:block;color:var(--label3);font-size:12.5px;font-weight:500}
.li.tot .k{color:var(--label);font-weight:700}
.li.tot .v{font-size:19px;font-weight:700;letter-spacing:-.03em}
.li.green .v{color:var(--ok)}
.note{display:flex;gap:10px;align-items:flex-start;padding:13px 16px;font-size:14px;line-height:1.45;color:var(--bad);background:rgba(229,56,79,.08)}
.note .ic{margin-top:2px;font-size:16px}
.sfoot{display:flex;gap:10px;padding:12px 22px 22px;background:linear-gradient(to top,rgba(247,242,255,.98) 60%,rgba(247,242,255,0));margin-top:-14px;position:relative;flex-shrink:0}
.sfoot .btnp{flex:1}
.sfoot .btns{padding:0 26px}
.btnp{height:54px;border-radius:999px;font-size:17px;font-weight:600;letter-spacing:-.015em;color:#fff;display:flex;align-items:center;justify-content:center;gap:9px;
  background:linear-gradient(180deg,#7a2cf0,var(--accent));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 14px 28px -12px rgba(97,5,220,.7);transition:transform .25s var(--spring)}
.btnp:active{transform:scale(.97)}
.btns{height:52px;border-radius:999px;font-size:17px;font-weight:600;letter-spacing:-.015em;display:flex;align-items:center;justify-content:center;gap:9px;background:rgba(255,255,255,.8);border:1px solid #fff;box-shadow:0 8px 20px -14px rgba(50,20,110,.4)}
.btns.red{color:var(--bad)}

/* hoja de acción (anular) */
.as{position:absolute;left:14px;right:14px;bottom:14px;z-index:41;animation:up .45s var(--spring)}
.as .box{border-radius:28px;padding:20px 18px 12px;background:rgba(252,250,255,.88);border:1px solid #fff;backdrop-filter:blur(40px) saturate(190%);-webkit-backdrop-filter:blur(40px) saturate(190%);box-shadow:0 30px 70px -20px rgba(20,5,60,.6)}
.as h3{margin:0;text-align:center;font-size:17px;font-weight:700;letter-spacing:-.02em}
.as p{margin:6px 6px 14px;text-align:center;font-size:13.5px;color:var(--label2);line-height:1.45}
.as .chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-bottom:12px}
.as .chips button{padding:7px 13px;border-radius:999px;background:rgba(120,100,170,.12);font-size:13.5px;font-weight:600}
.as .chips button.on{background:var(--accent);color:#fff}
.as input{width:100%;height:46px;border-radius:14px;border:1px solid var(--sep);background:rgba(255,255,255,.85);padding:0 14px;font-size:16px;outline:0;margin-bottom:10px}
.as input:focus{box-shadow:0 0 0 3px rgba(97,5,220,.2)}
.as .ab{display:block;width:100%;height:54px;border-top:1px solid var(--sep);font-size:18px;font-weight:500;letter-spacing:-.02em}
.as .ab.red{color:var(--bad);font-weight:600}
.as .ab.cancel{font-weight:700;color:var(--accent)}
.toast{position:absolute;left:50%;top:18px;transform:translate(-50%,-16px) scale(.96);padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;color:#fff;background:rgba(28,24,48,.88);backdrop-filter:blur(16px);opacity:0;pointer-events:none;transition:all .45s var(--spring);z-index:60;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0) scale(1)}

@container w (max-width:560px){
  .scroller{padding:20px 16px 112px}
  .top h1{font-size:32px}
  .cards{grid-template-columns:1fr}
  .big{font-size:50px}
  .dock{padding:30px 14px 16px}
  .menu{right:14px;bottom:78px}
  .sheet .sc{padding:6px 16px 30px}
  .sfoot{padding:12px 16px 18px}
}
</style>
</head>
<body>

<div class="bar">
  <div class="grp"><b>Maqueta · Historial de ventas (estilo Apple)</b><span style="opacity:.7">propuesta de rediseño, no es el módulo real</span></div>
  <div class="grp">
    <span>Quién lo usa</span>
    <div class="tog" id="tgRol"><button data-v="admin" class="on">Administrador</button><button data-v="cajero">Cajero</button></div>
    <span>Vista</span>
    <div class="tog" id="tgView"><button data-v="desk" class="on">Escritorio</button><button data-v="mobile">Celular</button></div>
    <button class="reset" id="btnReset">Reiniciar</button>
  </div>
</div>

<div class="stage" id="stage"><div class="win" id="win"><div class="mesh"></div><div class="scroller" id="sc"></div><div class="dock" id="dock"></div><div id="layer"></div><div class="toast" id="toast"></div></div></div>

<script>
/* ---------- datos de ejemplo ---------- */
const V=[

function r2(n){return Math.round(n*100)/100}
V.forEach(v=>{v.sub=r2(v.items.reduce((a,i)=>a+i[1]*i[2],0)); v.total=r2(v.sub-(v.desc||0)); v.util=r2(v.total-v.items.reduce((a,i)=>a+i[1]*i[3],0)); if(v.pm==='MIXTO'&&v.ef==null){v.ef=r2(v.total/2);v.otro=r2(v.total-v.ef);} });
const PM={EFECTIVO:{n:'Efectivo',c:'#22b573',g:'linear-gradient(160deg,#3ed592,#16a05f)',i:'cash'},YAPE:{n:'Yape',c:'#7c3aed',g:'linear-gradient(160deg,#a06bff,#6d28d9)',i:'phone'},PLIN:{n:'Plin',c:'#17b8d4',g:'linear-gradient(160deg,#45d3ea,#0f9bb8)',i:'phone'},TARJETA:{n:'Tarjeta',c:'#f59e0b',g:'linear-gradient(160deg,#ffc24d,#e08a00)',i:'card'},CREDITO:{n:'Fiado',c:'#f43f5e',g:'linear-gradient(160deg,#ff6d86,#dc2447)',i:'hand'},MIXTO:{n:'Mixto',c:'#64748b',g:'linear-gradient(160deg,#8796aa,#566377)',i:'split'},OTRO:{n:'Otros',c:'#a3aec0'}};

/* ---------- estado ---------- */
let ventas, rol='admin', rango='hoy', desde=6, hasta=0, q='', fpm='todos', sel=null, menu=false, anularId=null, motSel='';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num2=v=>Number(v||0).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2});
const money=v=>'S/ '+num2(v);
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const isAdmin=()=>rol==='admin';
const hoyD=new Date();
const fechaDe=d=>{const x=new Date(hoyD); x.setDate(x.getDate()-d); return x;};
const iso=d=>{const x=fechaDe(d); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');};
const cap=t=>t.charAt(0).toUpperCase()+t.slice(1);
const etiquetaDia=d=>d===0?'Hoy':d===1?'Ayer':cap(fechaDe(d).toLocaleDateString('es-PE',{weekday:'long',day:'numeric',month:'long'}));
const RG=[['hoy','Hoy'],['ayer','Ayer'],['7','7 días'],['mes','Mes'],['fechas','Fechas']];

const ICO={
  x:'<path d="M6 6l12 12M18 6L6 18"/>', check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>', search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  chev:'<path d="M9 5l7 7-7 7"/>', print:'<path d="M7 9V4h10v5M7 17H5a1 1 0 01-1-1v-5a2 2 0 012-2h12a2 2 0 012 2v5a1 1 0 01-1 1h-2M7 14h10v6H7z"/>',
  filter:'<path d="M4 7h16M7 12h10M10 17h4"/>', lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>',

const ic=(n,sz)=>`<svg class="ic" viewBox="0 0 24 24"${sz?` style="width:${sz}px;height:${sz}px"`:''}>${ICO[n]}</svg>`;

/* ---------- cálculos ---------- */
function enRango(){
  let a=0,b=0; if(rango==='hoy'){a=0;b=0;} else if(rango==='ayer'){a=1;b=1;} else if(rango==='7'){a=6;b=0;} else if(rango==='mes'){a=29;b=0;} else {a=desde;b=hasta;}
  return ventas.filter(v=>v.dia<=a&&v.dia>=b);
}
const activas=L=>L.filter(v=>!v.anul);
function resumen(L){
  const A=activas(L), total=r2(A.reduce((s,v)=>s+v.total,0)), util=r2(A.reduce((s,v)=>s+v.util,0));
  const por={}; A.forEach(v=>{ if(v.pm==='MIXTO'){ por.EFECTIVO=(por.EFECTIVO||0)+v.ef; por.OTRO=(por.OTRO||0)+v.otro; } else por[v.pm]=(por[v.pm]||0)+v.total; });
  const horas={}; A.forEach(v=>{const h=+v.h.slice(0,2); horas[h]=(horas[h]||0)+v.total;});
  return {n:A.length,total,util,ticket:A.length?r2(total/A.length):0,por,horas,anul:L.length-A.length};
}
function subtituloRango(){
  if(rango==='hoy') return cap(fechaDe(0).toLocaleDateString('es-PE',{weekday:'long',day:'numeric',month:'long'}));
  if(rango==='ayer') return cap(fechaDe(1).toLocaleDateString('es-PE',{weekday:'long',day:'numeric',month:'long'}));
  const a=rango==='7'?6:rango==='mes'?29:desde, b=rango==='7'||rango==='mes'?0:hasta; const f=d=>fechaDe(d).toLocaleDateString('es-PE',{day:'numeric',month:'short'});
  return a===b?f(a):`${f(a)} – ${f(b)}`;
}
const cuentaPM=(L,k)=>k==='todos'?L.length:k==='anul'?L.filter(v=>v.anul).length:L.filter(v=>v.pm===k&&!v.anul).length;

/* ---------- pantalla ---------- */
function render(keepScroll){
  const sc=$('#sc'), st=sc?sc.scrollTop:0;
  const L=enRango(), R=resumen(L);
  const filtrada=L.filter(v=>(fpm==='todos'||(fpm==='anul'?v.anul:v.pm===fpm&&!v.anul))&&(!q||norm(v.nro).includes(norm(q))||norm(v.cli).includes(norm(q))||v.items.some(i=>norm(i[0]).includes(norm(q)))));
  const ent=Math.floor(R.total), cent=String(Math.round((R.total-ent)*100)).padStart(2,'0');
  // anillo
  const ordenPM=Object.entries(R.por).sort((a,b)=>b[1]-a[1]), tot=ordenPM.reduce((a,b)=>a+b[1],0)||1, C=2*Math.PI*50;
  let acum=0; const arcos=ordenPM.map(([k,v])=>{const frac=v/tot, len=Math.max(0,frac*C-(ordenPM.length>1?7:0)); const off=-acum*C; acum+=frac; return `<circle cx="60" cy="60" r="50" stroke="${PM[k].c}" stroke-dasharray="${len} ${C}" stroke-dashoffset="${off}"/>`;}).join('');
  // horas
  const hs=[]; for(let h=8;h<=19;h++) hs.push(h); const mx=Math.max(1,...hs.map(h=>R.horas[h]||0)); const pk=hs.reduce((a,h)=>(R.horas[h]||0)>(R.horas[a]||0)?h:a,8);
  const dias=[...new Set(filtrada.map(v=>v.dia))].sort((a,b)=>a-b);
  $('#sc').innerHTML=`
  <div class="top"><div class="grow"><h1>Historial</h1><p>${subtituloRango()}</p></div><div class="tbtns">${isAdmin()?`<button class="gbtn" id="bCierres" aria-label="Cierres de caja" title="Cierres de caja">${ic('lock',18)}</button>`:''}<button class="gbtn" id="btnX" aria-label="Cerrar">${ic('x',18)}</button></div></div>
  <div class="seg" id="seg"><span class="th" id="th"></span>${RG.map(([k,t])=>`<button data-r="${k}" class="${rango===k?'on':''}">${t}</button>`).join('')}</div>
  ${rango==='fechas'?`<div class="dates"><input type="date" id="dD" value="${iso(desde)}"><span>a</span><input type="date" id="dH" value="${iso(hasta)}"></div>`:''}
  ${R.n?`<div class="cards">
    <div class="card"><div class="eyebrow">${ic('bag',15)} Total vendido</div><div class="big"><small>S/</small>${ent.toLocaleString('es-PE')}<sup>.${cent}</sup></div><div class="sub2">${R.n} venta${R.n===1?'':'s'}${R.anul?` · ${R.anul} anulada${R.anul===1?'':'s'}`:''}</div>
      <div class="mini"><div><span>Promedio</span><b>${money(R.ticket)}</b></div>${isAdmin()?`<div class="ok"><span>Ganancia</span><b>${money(R.util)}</b></div><div><span>Margen</span><b>${R.total?Math.round(R.util/R.total*100):0}%</b></div>`:''}</div></div>
    <div class="card"><div class="eyebrow">${ic('ring',15)} Cómo te pagaron</div><div class="ringwrap"><div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="50" stroke="rgba(120,100,170,.14)"/>${arcos}</svg><div class="c"><b>${ordenPM.length}</b><span>medio${ordenPM.length===1?'':'s'}</span></div></div>
      <div class="leg">${ordenPM.slice(0,4).map(([k,v])=>`<div><i style="background:${PM[k].c}"></i><span>${PM[k].n}</span><b>${Math.round(v/tot*100)}%</b></div>`).join('')}</div></div></div>
    <div class="card wide"><div class="eyebrow">${ic('chart',15)} Ventas por hora</div><div class="bars">${hs.map(h=>`<div class="b ${h===pk&&R.horas[h]?'pk':''}"><i style="height:${Math.max(6,(R.horas[h]||0)/mx*100)}%"></i><span>${h%2===0?h:''}</span></div>`).join('')}</div>
      ${R.horas[pk]?`<div class="peak">Hora fuerte: <b>${pk}:00 – ${pk+1}:00</b> con ${money(R.horas[pk])}</div>`:''}</div></div>`:''}
  ${dias.length?dias.map(d=>{const dl=filtrada.filter(v=>v.dia===d), s=r2(activas(dl).reduce((a,v)=>a+v.total,0)); return `<div class="sec"><h2>${etiquetaDia(d)}</h2><span>${activas(dl).length} venta${activas(dl).length===1?'':'s'} · ${money(s)}</span></div><div class="group">${dl.map(rowHTML).join('')}</div>`;}).join(''):`<div class="empty"><div class="eico">${ic('receipt',34)}</div><b>${L.length?'Nada coincide':'Sin ventas'}</b>${L.length?'Prueba con otra palabra o quita el filtro.':'No hay ventas en este rango. Prueba con otras fechas.'}</div>`}`;
  // dock
  $('#dock').innerHTML=`<div class="dockin"><label class="sbar">${ic('search',18)}<input type="text" id="q" placeholder="Buscar boleta, cliente o producto" value="${esc(q)}" autocomplete="off"></label><button class="fbtn" id="bF" aria-label="Filtros">${ic('filter',20)}${fpm!=='todos'?'<i class="dotn"></i>':''}</button></div>`;
  // capa: menú, hoja, acción
  renderLayer(L);
  // eventos
  $('#btnX').onclick=()=>toast('Se cerraría el módulo.');
  const bc=$('#bCierres'); if(bc) bc.onclick=()=>toast('Abriría el historial de cierres de caja.');
  $$('#seg button').forEach(b=>b.onclick=()=>{rango=b.dataset.r; if(rango==='fechas'){desde=6;hasta=0;} sel=null; render();});
  const calc=s=>Math.round((new Date(iso(0)+'T00:00')-new Date(s+'T00:00'))/86400000);
  const dd=$('#dD'),dh=$('#dH'); if(dd){dd.onchange=()=>{desde=Math.max(0,calc(dd.value)); render(true);}; dh.onchange=()=>{hasta=Math.max(0,calc(dh.value)); render(true);};}
  const qi=$('#q'); qi.oninput=()=>{q=qi.value; const p=qi.selectionStart; render(true); const n=$('#q'); n.focus(); n.setSelectionRange(p,p);};
  $('#bF').onclick=()=>{menu=!menu; renderLayer(enRango());};
  $$('.row').forEach(b=>b.onclick=()=>{sel=+b.dataset.id; menu=false; render(true); });
  moverPastilla(!!keepScroll);
  if(keepScroll) $('#sc').scrollTop=st;
}
function moverPastilla(sinAnim){
  const th=$('#th'), on=$('#seg button.on'); if(!th||!on) return;
  if(sinAnim){th.style.transition='none';} th.style.width=on.offsetWidth+'px'; th.style.transform=`translateX(${on.offsetLeft-3}px)`;
  if(sinAnim){requestAnimationFrame(()=>{th.style.transition='';});}
}
function rowHTML(v){
  const p=PM[v.pm];
  return `<button class="row ${v.anul?'anul':''}" data-id="${v.id}"><span class="pmi" style="background:${p.g}">${ic(p.i,19)}</span><span class="t"><b>${esc(v.cli)}</b><span>${v.h} · ${v.nro}${v.anul?' · <em style="font-style:normal;color:var(--bad);font-weight:700">Anulada</em>':''}</span></span><span class="r"><b>${money(v.total)}</b><span>${p.n}</span></span><span class="chev">${ic('chev',14)}</span></button>`;
}

/* ---------- capa: menú de filtros, hoja de la boleta, hoja de acción ---------- */
function renderLayer(L){
  const el=$('#layer'); let h='';
  if(menu){
    const items=[['todos','Todas las ventas',null],['EFECTIVO','Efectivo',PM.EFECTIVO.c],['YAPE','Yape',PM.YAPE.c],['PLIN','Plin',PM.PLIN.c],['TARJETA','Tarjeta',PM.TARJETA.c],['CREDITO','Fiado',PM.CREDITO.c],['MIXTO','Mixto',PM.MIXTO.c]].filter(([k])=>k==='todos'||cuentaPM(L,k)>0);
    h+=`<div class="scrim" id="mScrim" style="background:transparent;backdrop-filter:none;z-index:19"></div><div class="menu" id="menu"><h4>Medio de pago</h4>${items.map(([k,t,c])=>`<button class="mi ${fpm===k?'on':''}" data-f="${k}">${c?`<i class="d" style="background:${c}"></i>`:ic('receipt',16)}${t}<span class="n">${cuentaPM(L,k)}</span><span class="ck">${ic('check',15)}</span></button>`).join('')}
      <hr><button class="mi ${fpm==='anul'?'on':''}" data-f="anul">${ic('warn',16)}Anuladas<span class="n">${cuentaPM(L,'anul')}</span><span class="ck">${ic('check',15)}</span></button>
      ${isAdmin()&&L.length?`<hr><button class="mi" id="mXl">${ic('xl',16)}Exportar a Excel</button>`:''}</div>`;
  }
  const v=ventas.find(x=>x.id===sel);
  if(v){
    const p=PM[v.pm];
    const ent=Math.floor(v.total), cent=String(Math.round((v.total-ent)*100)).padStart(2,'0');
    h+=`<div class="scrim" id="sScrim"></div><div class="sheet" id="sheet"><div class="grab"></div><div class="sc">
      <div class="sh-top"><div class="spacer"></div><button class="gbtn" id="sClose" aria-label="Cerrar">${ic('x',18)}</button></div>
      <div class="hero ${v.anul?'anul':''}"><div class="pmi" style="background:${p.g}">${ic(p.i,28)}</div><div class="amt"><small>S/</small>${ent.toLocaleString('es-PE')}<small>.${cent}</small></div><p>${esc(v.cli)} · ${v.nro}</p><span class="st ${v.anul?'bad':''}">${ic(v.anul?'warn':'check',14)} ${v.anul?'Anulada':'Venta completada'}</span></div>
      <div class="lg">
        <div class="li"><span class="k">Fecha</span><span class="v">${etiquetaDia(v.dia)==='Hoy'||etiquetaDia(v.dia)==='Ayer'?etiquetaDia(v.dia):fechaDe(v.dia).toLocaleDateString('es-PE',{day:'numeric',month:'long'})}, ${v.h}</span></div>
        <div class="li"><span class="k">Atendió</span><span class="v">${esc(v.cj)}</span></div>
        <div class="li"><span class="k">Pagó con</span><span class="v">${p.n}${v.pm==='MIXTO'?`<small>${money(v.ef)} efectivo · ${money(v.otro)} otro</small>`:''}</span></div>
        ${isAdmin()?`<div class="li green"><span class="k">Ganancia</span><span class="v">${money(v.util)}</span></div>`:''}</div>
      <div class="lg">${v.items.map(i=>`<div class="li it"><span class="q">${i[1]}×</span><span class="d">${esc(i[0])}<small>${money(i[2])} c/u</small></span><span class="v">${money(i[1]*i[2])}</span></div>`).join('')}
        ${v.desc?`<div class="li"><span class="k">Subtotal</span><span class="v">${money(v.sub)}</span></div><div class="li green"><span class="k">Descuento</span><span class="v">− ${money(v.desc)}</span></div>`:''}
        <div class="li tot"><span class="k">Total</span><span class="v">${money(v.total)}</span></div></div>
      ${v.anul?`<div class="lg"><div class="note">${ic('warn',16)}<span><b>Boleta anulada.</b> Motivo: ${esc(v.motivo||'Sin motivo especificado')}. El stock se repuso${v.pm==='CREDITO'?' y la deuda del cliente se revirtió':''}.</span></div></div>`:''}
    </div><div class="sfoot"><button class="btnp" id="sPrint">${ic('print',20)} Reimprimir boleta</button>${isAdmin()&&!v.anul?`<button class="btns red" id="sAnular">Anular</button>`:''}</div></div>`;
  }
  if(anularId){
    const a=ventas.find(x=>x.id===anularId);
    h+=`<div class="scrim" style="z-index:40;background:rgba(25,12,60,.38)"></div><div class="as"><div class="box"><h3>¿Anular la boleta ${a.nro}?</h3><p>Se devuelve el stock${a.pm==='CREDITO'?' y se descuenta la deuda del cliente':''}. Esta acción no se puede deshacer.</p>
      <div class="chips">${['El cliente se arrepintió','Error de precio','Producto equivocado','Venta duplicada'].map(t=>`<button class="${motSel===t?'on':''}" data-t="${t}">${t}</button>`).join('')}</div>
      <input type="text" id="mot" placeholder="Motivo (opcional)" value="${esc(motSel)}" autocomplete="off">
      <button class="ab red" id="aOk">Anular boleta</button><button class="ab cancel" id="aNo">Cancelar</button></div></div>`;
  }
  el.innerHTML=h;
  $$('#menu .mi[data-f]').forEach(b=>b.onclick=()=>{fpm=b.dataset.f; menu=false; render(true);});
  const sc=$('#mScrim'); if(sc) sc.onclick=()=>{menu=false; renderLayer(L);};
  const mx=$('#mXl'); if(mx) mx.onclick=()=>{menu=false; renderLayer(L); toast('Descargaría Ventas_'+iso(0)+'.xlsx');};
  const ss=$('#sScrim'); if(ss) ss.onclick=()=>{sel=null; renderLayer(L);};
  const scl=$('#sClose'); if(scl) scl.onclick=()=>{sel=null; renderLayer(L);};
  const sp=$('#sPrint'); if(sp) sp.onclick=()=>toast('Abriría la boleta '+v.nro+' para imprimir');
  const sa=$('#sAnular'); if(sa) sa.onclick=()=>{anularId=v.id; motSel=''; renderLayer(L);};
  $$('.as .chips button').forEach(b=>b.onclick=()=>{motSel=b.dataset.t; renderLayer(L);});
  const mi=$('#mot'); if(mi) mi.oninput=()=>{motSel=mi.value;};
  const an=$('#aNo'); if(an) an.onclick=()=>{anularId=null; renderLayer(L);};
  const ao=$('#aOk'); if(ao) ao.onclick=()=>{const a=ventas.find(x=>x.id===anularId); a.anul=true; a.motivo=(motSel||'').trim()||'Sin motivo especificado'; anularId=null; render(true); toast('Boleta '+a.nro+' anulada');};
}

let tT; function toast(m){const t=$('#toast'); if(!t) return; t.textContent=m; t.classList.add('on'); clearTimeout(tT); tT=setTimeout(()=>t.classList.remove('on'),2300);}
function reset(){ ventas=JSON.parse(JSON.stringify(V)); rango='hoy'; q=''; fpm='todos'; sel=null; menu=false; anularId=null; render(); }
$$('#tgRol button').forEach(b=>b.onclick=()=>{rol=b.dataset.v; $$('#tgRol button').forEach(x=>x.classList.toggle('on',x===b)); render(true);});
$$('#tgView button').forEach(b=>b.onclick=()=>{$$('#tgView button').forEach(x=>x.classList.toggle('on',x===b)); $('#stage').classList.toggle('mobile',b.dataset.v==='mobile'); render(true);});
$('#btnReset').onclick=reset;
window.addEventListener('resize',()=>moverPastilla(true));
document.fonts&&document.fonts.ready.then(()=>moverPastilla(true));
reset();
</script>
</body>
</html>
