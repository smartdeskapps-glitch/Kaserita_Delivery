<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maqueta · Cuentas por cobrar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --p:#6105dc; --p-dark:#4d04b0; --p-soft:#f4eefe; --p-line:#e4d6fb; --p-ring:rgba(97,5,220,.16);
  --ink:#1c1830; --mut:#78729a; --line:#ece7f5; --card:#fff;
  --ok:#059669; --ok-soft:#e8f8f1; --warn:#b45309; --warn-soft:#fff4e0; --bad:#e11d48; --bad-soft:#fff0f3;
  --f-head:'Plus Jakarta Sans',system-ui,sans-serif; --f-body:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{font-family:var(--f-body);color:var(--ink);background:#e9e4f5;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}
em{font-style:normal;color:var(--mut);font-weight:500}
s{color:#b5afcb}
.ic{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* ---- barra de la maqueta ---- */
.bar{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;justify-content:space-between;padding:10px 20px;background:#1c1830;color:#fff;font-size:12.5px}
.bar b{font-family:var(--f-head);font-size:13.5px}
.bar .grp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bar .tog{display:inline-flex;background:rgba(255,255,255,.1);border-radius:999px;padding:3px}
.bar .tog button{background:none;border:0;color:#d9d2ee;padding:5px 13px;border-radius:999px;font-size:12px;font-weight:600}
.bar .tog button.on{background:#fff;color:#1c1830}
.bar .reset{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:999px;padding:5px 13px;font-size:12px}

.stage{display:flex;justify-content:center;padding:22px 14px 40px}
.modal{container-type:inline-size;container-name:m;position:relative;width:min(1000px,100%);height:min(790px,calc(100vh - 110px));min-height:640px;background:linear-gradient(150deg,#f4effc,#f9f8fb 55%,#f5f4f8);border:1px solid #fff;border-radius:28px;box-shadow:0 30px 70px -20px rgba(60,20,120,.35);display:flex;flex-direction:column;overflow:hidden}
.stage.mobile .modal{width:390px;height:790px;border-radius:34px;border:8px solid #1c1830;box-shadow:0 30px 70px -20px rgba(0,0,0,.5)}

.head{background:#fff;border-bottom:1px solid var(--line);padding:16px 20px;flex-shrink:0;display:flex;align-items:center;gap:14px}
.head .tile{width:44px;height:44px;border-radius:14px;background:var(--p-soft);color:var(--p);display:grid;place-items:center;font-size:22px;flex-shrink:0}
.head h1{margin:0;font-family:var(--f-head);font-size:18px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.head p{margin:2px 0 0;font-size:12.5px;color:var(--mut)}
.grow{min-width:0;flex:1}
.x{width:34px;height:34px;border:0;background:none;border-radius:50%;color:var(--mut);display:grid;place-items:center;flex-shrink:0}
.x:hover{background:#f3f0fa;color:var(--ink)}
.backm{display:none;border:0;background:none;color:var(--mut);font-size:12.5px;font-weight:700;padding:4px 8px 4px 2px;border-radius:8px;align-items:center;gap:6px}

.split{flex:1;min-height:0;display:grid;grid-template-columns:350px minmax(0,1fr)}
.col{min-height:0;display:flex;flex-direction:column}
.list{border-right:1px solid var(--line);background:rgba(255,255,255,.55)}
.scroll{flex:1;min-height:0;overflow-y:auto}

/* resumen */
.sum{padding:16px 16px 4px}
.sum .big{display:flex;align-items:baseline;gap:8px}
.sum .big small{font-size:12px;font-weight:700;color:var(--mut)}
.sum .big strong{font-family:var(--f-head);font-size:30px;font-weight:800;letter-spacing:-.02em;color:var(--ink);line-height:1.1}
.sum .stat{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--p-soft);color:var(--p-dark);white-space:nowrap}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.gray{background:#f1eef9;color:var(--mut)}
.tools{padding:12px 16px 8px}
.search{position:relative}
.search .lupa{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#b5afcb;font-size:15px;pointer-events:none;display:grid;place-items:center;width:18px;height:18px}
.search input{width:100%;height:40px;border:1.5px solid #e6e0f2;background:#fff;border-radius:14px;padding:0 14px 0 38px;font-size:13.5px;outline:0}
.search input:focus{border-color:var(--p);box-shadow:0 0 0 4px var(--p-ring)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:all .15s}
.chip:hover{border-color:var(--p-line);background:var(--p-soft)}
.chip.on{border-color:var(--p);background:var(--p-soft);color:var(--p-dark);box-shadow:0 0 0 3px var(--p-ring)}
.chip .n{font-size:10.5px;background:#f1eef9;color:var(--mut);border-radius:99px;padding:1px 6px}
.chip.on .n{background:var(--p);color:#fff}
.sortrow{display:flex;justify-content:space-between;align-items:center;padding:4px 16px 8px;font-size:11.5px;color:var(--mut);font-weight:600}
.sortrow button{border:0;background:none;color:var(--p-dark);font-size:11.5px;font-weight:700;padding:3px 6px;border-radius:8px}
.sortrow button:hover{background:var(--p-soft)}

/* filas de clientes */
.rows{padding:0 10px 12px;display:grid;gap:6px}
.row{display:flex;align-items:center;gap:11px;border:1.5px solid transparent;background:#fff;border-radius:16px;padding:10px 11px;text-align:left;width:100%;transition:all .15s;position:relative}
.row:hover{border-color:var(--p-line);background:#fcfaff}
.row.on{border-color:var(--p);background:#fcfaff;box-shadow:0 0 0 3px var(--p-ring)}
.av{width:40px;height:40px;border-radius:50%;background:var(--p-soft);color:var(--p);display:grid;place-items:center;font-weight:800;font-size:13px;flex-shrink:0;font-family:var(--f-head)}
.av.bad{background:var(--bad-soft);color:var(--bad)}
.row .nm{font-size:13.5px;font-weight:700;display:block;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .mt{font-size:11.5px;color:var(--mut);display:block;margin-top:2px}
.row .mt b{font-weight:700}
.row .mt.bad{color:var(--bad)}
.row .amt{margin-left:auto;text-align:right;flex-shrink:0}
.row .amt strong{display:block;font-family:var(--f-head);font-size:14.5px;font-weight:800;letter-spacing:-.01em}
.row .lim{display:block;width:56px;height:4px;border-radius:9px;background:#ece7f5;margin:5px 0 0 auto;overflow:hidden}
.row .lim i{display:block;height:100%;background:var(--ok)} .row .lim i.w{background:#e0a030} .row .lim i.b{background:var(--bad)}
.empty{margin:40px auto;text-align:center;max-width:300px;color:var(--mut);font-size:13.5px;line-height:1.5;padding:0 16px}
.empty .bigi{width:72px;height:72px;border-radius:24px;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;font-size:32px;margin:0 auto 12px}
.empty b{display:block;color:var(--ink);font-family:var(--f-head);font-size:16px;margin-bottom:3px}

/* detalle */
.det{padding:18px 20px;overflow-y:auto;flex:1;min-height:0}
.who{display:flex;align-items:center;gap:13px;margin-bottom:14px}
.who .av{width:52px;height:52px;font-size:17px}
.who h2{margin:0;font-family:var(--f-head);font-size:19px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.who .sub{font-size:12.5px;color:var(--mut);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
.acts{display:flex;gap:8px;margin-left:auto;flex-shrink:0}
.btn{height:44px;border-radius:14px;border:0;padding:0 18px;font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:all .15s;white-space:nowrap}
.btn.pri{background:var(--p);color:#fff;box-shadow:0 8px 18px -8px rgba(97,5,220,.6)}
.btn.pri:hover{background:var(--p-dark)}
.btn.pri:disabled{background:#d9d2ea;box-shadow:none;cursor:not-allowed}
.btn.sec{background:var(--p-soft);color:var(--p-dark)} .btn.sec:hover{background:#ece0fd}
.btn.line{background:#fff;border:1.5px solid var(--line);color:var(--ink)} .btn.line:hover{border-color:var(--p-line);background:var(--p-soft)}
.btn.sm{height:36px;padding:0 13px;font-size:12.5px;border-radius:12px}
.btn.blk{width:100%}
.debt{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px 18px;margin-bottom:14px}
.debt .t{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.debt .t span{font-size:12px;font-weight:700;color:var(--mut)}
.debt .t strong{font-family:var(--f-head);font-size:32px;font-weight:800;letter-spacing:-.02em;color:var(--bad);line-height:1.1}
.debt .meter{height:9px;border-radius:99px;background:#ece7f5;overflow:hidden;margin-top:12px}
.debt .meter i{display:block;height:100%;background:var(--ok);transition:width .25s}
.debt .meter i.w{background:#e0a030} .debt .meter i.b{background:var(--bad)}
.debt .ml{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut);font-weight:600;margin-top:6px;gap:8px;flex-wrap:wrap}
.debt .ven{margin-top:12px;display:flex;gap:9px;align-items:flex-start;border-radius:14px;padding:9px 12px;font-size:12px;line-height:1.45;background:var(--bad-soft);color:var(--bad)}
.debt .ven svg{margin-top:2px}

.panel{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px 18px;margin-bottom:14px}
.panel .ph{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px}
.panel h3{margin:0;font-family:var(--f-head);font-size:14.5px;font-weight:800;letter-spacing:-.01em}
.link{border:0;background:none;color:var(--p-dark);font-size:12px;font-weight:700;padding:3px 6px;border-radius:8px}
.link:hover{background:var(--p-soft)}
.bol{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.bol:last-child{border-bottom:0}
.bol .ck{width:22px;height:22px;border-radius:50%;border:2px solid #d8d2e8;display:grid;place-items:center;color:#fff;font-size:12px;flex-shrink:0;margin-top:1px;transition:all .15s}
.bol.cov .ck{background:var(--ok);border-color:var(--ok)}
.bol .b1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.bol .nro{font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.bol .tot{font-family:var(--f-head);font-weight:800;font-size:14px;white-space:nowrap}
.bol .it{font-size:11.5px;color:var(--mut);margin-top:2px;line-height:1.4}
.bol.paid{opacity:.5}
.bol.paid .tot{text-decoration:line-through}

/* pago */
.pay{background:#fff;border:1.5px solid var(--p-line);border-radius:22px;padding:16px 18px;box-shadow:0 14px 30px -20px rgba(97,5,220,.45)}
.pay h3{margin:0 0 10px;font-family:var(--f-head);font-size:14.5px;font-weight:800}
.amount{display:flex;align-items:baseline;gap:10px;border:2px solid #e6e0f2;border-radius:20px;background:#fbfaff;padding:10px 16px;transition:all .15s}
.amount:focus-within{border-color:var(--p);background:#fff;box-shadow:0 0 0 5px var(--p-ring)}
.amount.err{border-color:var(--bad);background:var(--bad-soft)}
.amount .cur{font-family:var(--f-head);font-weight:800;font-size:20px;color:#b5afcb}
.amount input{border:0;background:none;padding:0;font-family:var(--f-head);font-weight:800;font-size:34px;letter-spacing:-.02em;outline:0;width:100%;min-width:0}
.amount input::placeholder{color:#cfc8e4}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.qb{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:6px 12px;font-size:12.5px;font-weight:700;transition:all .15s}
.qb:hover{border-color:var(--p-line);background:var(--p-soft);color:var(--p-dark)}
.qb.on{border-color:var(--p);background:var(--p-soft);color:var(--p-dark)}
.after{margin-top:12px;display:flex;justify-content:space-between;align-items:center;border-radius:14px;padding:10px 14px;background:#f7f4fc;font-size:12.5px;font-weight:600;color:var(--mut);gap:10px}
.after b{font-family:var(--f-head);font-size:16px;font-weight:800;color:var(--ink)}
.after.ok{background:var(--ok-soft);color:var(--ok)} .after.ok b{color:var(--ok)}
.after.bad{background:var(--bad-soft);color:var(--bad)} .after.bad b{color:var(--bad)}
.cover{margin-top:8px;font-size:11.5px;color:var(--mut);font-weight:600}

/* pagos recientes */
.hist{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.hist:last-child{border-bottom:0}
.hist span{color:var(--mut)} .hist b{font-weight:700;color:var(--ok)}

/* pago registrado */
.fin{text-align:center;padding:36px 16px;max-width:380px;margin:0 auto}
.fin .big{width:84px;height:84px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;margin:0 auto 14px;font-size:38px}
.fin h2{font-family:var(--f-head);font-size:22px;font-weight:800;margin:0 0 4px}
.fin p{margin:0 auto 14px;color:var(--mut);font-size:13.5px;line-height:1.5}
.fin .sumr{background:#fff;border:1px solid var(--line);border-radius:20px;padding:4px 16px;text-align:left;margin-bottom:16px}
.fin .sumr .r{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:13px}
.fin .sumr .r:last-child{border-bottom:0}
.fin .sumr .r span{color:var(--mut)}
.fin .btns{display:grid;gap:8px}
.noselect{margin:auto;text-align:center;color:var(--mut);font-size:13.5px;max-width:260px;line-height:1.5;padding:20px}
.noselect .bigi{width:64px;height:64px;border-radius:20px;background:var(--p-soft);color:var(--p);display:grid;place-items:center;font-size:28px;margin:0 auto 10px}

/* barra inferior de pago en celular */
.dock{display:none}

.toast{position:absolute;left:50%;bottom:20px;transform:translate(-50%,20px);background:#1c1830;color:#fff;padding:10px 16px;border-radius:14px;font-size:12.5px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s;z-index:70;max-width:88%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

@container m (max-width:760px){
  .split{grid-template-columns:minmax(0,1fr)}
  .list{border-right:0}
  .split.det-open .list{display:none}
  .split:not(.det-open) .detcol{display:none}
  .head{padding:12px 14px;gap:10px}.head .tile{width:38px;height:38px;font-size:19px}.head h1{font-size:16px}.head p{display:none}
  .backm{display:inline-flex}
  .det{padding:14px;display:flex;flex-direction:column}
  .det .who{order:1}.det .debt{order:2}.det .pay{order:3;margin-bottom:14px}.det .panel{order:4}
  .who{flex-wrap:wrap}
  .acts{margin-left:0;width:100%}.acts .btn{flex:1}
  .debt .t strong{font-size:28px}
  .amount input{font-size:30px}
}
</style>
</head>
<body>

<div class="bar">
  <div class="grp"><b>Maqueta · Cuentas por cobrar</b><span style="opacity:.7">propuesta de rediseño, no es el módulo real</span></div>
  <div class="grp">
    <span>Datos</span>
    <div class="tog" id="tgData"><button data-v="con" class="on">Con deudas</button><button data-v="sin">Sin deudas</button></div>
    <span>Vista</span>
    <div class="tog" id="tgView"><button data-v="desk" class="on">Escritorio</button><button data-v="mobile">Celular</button></div>
    <button class="reset" id="btnReset">Reiniciar</button>
  </div>
</div>

<div class="stage" id="stage"><div class="modal" id="modal"></div></div>

<script>
/* ---------- datos de ejemplo ---------- */
// fecha = hace N días; items = descripción corta. pagado = lo ya abonado (se descuenta de las boletas más antiguas, como en la app).
const SEED=[
  {id:'k1',nombre:'Rosa Mendoza Vega',dni:'43218876',tel:'987654321',limite:600,dias:30,pagado:60,
   boletas:[{nro:'B001-0412',hace:41,total:128.5,items:'Arroz 5kg x2, Aceite 1L x3, Azúcar 1kg x4'},{nro:'B001-0498',hace:19,total:96.4,items:'Leche evaporada x12, Fideos x6'},{nro:'B001-0533',hace:8,total:240,items:'Pollo entero x4, Huevos x30 x2'},{nro:'B001-0571',hace:2,total:71.5,items:'Pan x20, Mantequilla x2'}]},
  {id:'k2',nombre:'Bodega El Progreso',dni:'20601234567',tel:'955123456',limite:2000,dias:15,pagado:0,
   boletas:[{nro:'B001-0501',hace:22,total:760,items:'Gaseosas pack x20, Agua x30'},{nro:'B001-0560',hace:5,total:540.9,items:'Galletas x40, Snacks x30'}]},
  {id:'k3',nombre:'Carlos Huamán Pérez',dni:'40112233',tel:'',limite:300,dias:30,pagado:0,
   boletas:[{nro:'B001-0566',hace:4,total:112.3,items:'Detergente x2, Lejía x2, Papel higiénico x4'}]},
  {id:'k4',nombre:'María Fernanda Ríos',dni:'46789012',tel:'944332211',limite:250,dias:30,pagado:0,
   boletas:[{nro:'B001-0520',hace:14,total:205,items:'Carnes y embutidos varios'}]},
  {id:'k5',nombre:'Jorge Quispe Lara',dni:'41556677',tel:'933221100',limite:500,dias:30,pagado:100,
   boletas:[{nro:'B001-0388',hace:55,total:180,items:'Abarrotes surtidos'},{nro:'B001-0509',hace:12,total:60.5,items:'Lácteos x8'}]}
];
const PAGOS={k1:[['hace 9 días',60,'Luis Torres'],['hace 38 días',120,'Diana Ramírez']],k5:[['hace 20 días',100,'Luis Torres']]};

/* ---------- estado ---------- */
let data='con', clients, sel=null, q='', filtro='todos', orden='deuda', abono='', done=null, hist=false;
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=v=>'S/ '+Number(v||0).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2});
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0};
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const clone=o=>JSON.parse(JSON.stringify(o));
const iniciales=n=>n.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const r2=v=>Math.round(v*100)/100;

const ICO={
  hand:'<path d="M11 15h2a2 2 0 100-4h-3c-.6 0-1.1.2-1.4.6L3 16M7 21l1.6-1.4c.3-.4.8-.6 1.4-.6h4c1.1 0 2.1-.4 2.8-1.2l4.6-4.4a2 2 0 00-2.75-2.91l-4.2 3.9M2 16l6 6"/><circle cx="16" cy="9" r="2.9"/><circle cx="6" cy="5" r="3"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>', check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>', back:'<path d="M15 5l-7 7 7 7"/>', search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  pdf:'<path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M12 12v6M9 15l3 3 3-3"/>',
  chat:'<path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.6A8 8 0 1121 12z"/>', warn:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.01"/>',
  phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/>', cal:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',
  next:'<path d="M9 5l7 7-7 7"/>'
};
const ic=(n,sz)=>`<svg class="ic" viewBox="0 0 24 24"${sz?` style="width:${sz}px;height:${sz}px"`:''}>${ICO[n]}</svg>`;

/* ---------- cálculos (misma lógica FIFO de la app) ---------- */
// Los abonos cubren primero las boletas más antiguas; vencida = pasó el plazo de crédito del cliente.
function estado(c){
  const asc=[...c.boletas].sort((a,b)=>b.hace-a.hace);
  const total=asc.reduce((a,b)=>a+b.total,0), yaPagado=Math.max(0,r2(c.pagado));
  let acum=0;
  const bol=asc.map(b=>{acum+=b.total; const pagada=acum<=yaPagado+0.01; const dv=b.hace-c.dias; return {...b,pagada,vencida:!pagada&&dv>0,diasVencido:dv};});
  const pend=bol.filter(b=>!b.pagada);
  const saldo=r2(total-yaPagado);
  const venc=pend.filter(b=>b.vencida);
  const sumPagadas=bol.filter(b=>b.pagada).reduce((a,b)=>a+b.total,0), parcial=Math.max(0,r2(yaPagado-sumPagadas));
  return {bol:[...bol].reverse(), pend, saldo, parcial, vencidoMonto:r2(venc.reduce((a,b)=>a+b.total,0)), venc, masVieja:pend[0]||null, uso:c.limite>0?saldo/c.limite:0};
}
const deudores=()=>clients.map(c=>({c,e:estado(c)})).filter(x=>x.e.saldo>0.004);
function cobertura(c,monto){ // cuántas boletas pendientes quedan cubiertas con este abono
  const e=estado(c); let resto=monto+e.parcial, n=0; const ids=[]; // lo ya abonado a la primera boleta cuenta
  for(const b of e.pend){ if(resto+0.01>=b.total){resto-=b.total;n++;ids.push(b.nro);} else break; }
  return {n,total:e.pend.length,ids};
}

/* ---------- pantalla principal ---------- */
function render(){
  const all=deudores(), total=r2(all.reduce((a,x)=>a+x.e.saldo,0)), vencido=r2(all.reduce((a,x)=>a+x.e.vencidoMonto,0)), nVenc=all.filter(x=>x.e.venc.length).length;
  $('#modal').innerHTML=`
  <div class="head">${sel?`<button class="backm" id="mBack">${ic('back',14)} Clientes</button>`:''}<div class="tile">${ic('hand',22)}</div><div class="grow"><h1>Cuentas por cobrar</h1><p>Lo que tus clientes te deben a crédito. Elige a quién cobrarle y registra su pago.</p></div><button class="x" id="btnX" aria-label="Cerrar">${ic('x',18)}</button></div>
  <div class="split ${sel?'det-open':''}" id="split"><div class="col list" id="colList"></div><div class="col detcol" id="colDet"></div></div><div class="toast" id="toast"></div>`;
  $('#btnX').onclick=()=>toast('Se cerraría el módulo.');
  const mb=$('#mBack'); if(mb) mb.onclick=()=>{sel=null; done=null; render();};
  renderList(all,total,vencido,nVenc); renderDet();
}
function renderList(all,total,vencido,nVenc){
  const el=$('#colList');
  if(!all.length){ el.innerHTML=`<div class="empty"><div class="bigi">${ic('check',32)}</div><b>No hay clientes con deuda</b>Todo está cobrado. Cuando vendas a crédito, el cliente aparecerá aquí.</div>`; return; }
  const nLim=all.filter(x=>x.e.uso>=0.8).length;
  let L=all.filter(x=>(filtro==='todos'||(filtro==='venc'&&x.e.venc.length)||(filtro==='lim'&&x.e.uso>=0.8))&&(!q||norm(x.c.nombre).includes(norm(q))||x.c.dni.includes(q)));
  L.sort(orden==='deuda'?(a,b)=>b.e.saldo-a.e.saldo:(a,b)=>(b.e.masVieja?b.e.masVieja.hace:0)-(a.e.masVieja?a.e.masVieja.hace:0));
  el.innerHTML=`<div class="sum"><div class="big"><small>Total por cobrar</small></div><div class="big"><strong>${money(total)}</strong></div>
    <div class="stat"><span class="pill gray">${all.length} cliente${all.length>1?'s':''}</span>${vencido>0?`<span class="pill bad">${money(vencido)} vencido</span>`:`<span class="pill ok">Nada vencido</span>`}</div></div>
    <div class="tools"><div class="search"><span class="lupa">${ic('search',15)}</span><input type="text" id="q" placeholder="Buscar por nombre o DNI…" value="${esc(q)}" autocomplete="off"></div>
    <div class="chips" id="chips">${[['todos','Todos',all.length],['venc','Vencidos',nVenc],['lim','Cerca del límite',nLim]].map(([k,t,n])=>`<button class="chip ${filtro===k?'on':''}" data-f="${k}">${t} <span class="n">${n}</span></button>`).join('')}</div></div>
    <div class="sortrow"><span>${L.length} resultado${L.length===1?'':'s'}</span><button id="sort">Orden: ${orden==='deuda'?'mayor deuda':'más antigua'}</button></div>
    <div class="scroll"><div class="rows" id="rows">${L.map(rowHTML).join('')||'<div class="empty" style="margin:24px auto"><b>Nadie coincide</b>Prueba con otro filtro o nombre.</div>'}</div></div>`;
  $('#q').oninput=e=>{q=e.target.value; const p=e.target.selectionStart; render(); const i=$('#q'); i.focus(); i.setSelectionRange(p,p);};
  $$('#chips .chip').forEach(b=>b.onclick=()=>{filtro=b.dataset.f; render();});
  $('#sort').onclick=()=>{orden=orden==='deuda'?'antigua':'deuda'; render();};
  $$('#rows .row').forEach(b=>b.onclick=()=>elegir(b.dataset.id));
}
function rowHTML({c,e}){
  const v=e.venc.length, mv=e.masVieja;
  const sub=v?`<span class="mt bad"><b>Vencida hace ${e.venc[0].diasVencido} d</b> · ${e.pend.length} boleta${e.pend.length>1?'s':''}</span>`:`<span class="mt">${mv?`Debe desde hace ${mv.hace} d`:''} · ${e.pend.length} boleta${e.pend.length>1?'s':''}</span>`;
  const cls=e.uso>=1?'b':e.uso>=0.8?'w':'';
  return `<button class="row ${sel===c.id?'on':''}" data-id="${c.id}"><span class="av ${v?'bad':''}">${iniciales(c.nombre)}</span><span style="min-width:0"><span class="nm">${esc(c.nombre)}</span>${sub}</span><span class="amt"><strong>${money(e.saldo)}</strong>${c.limite>0?`<span class="lim" title="Usa ${Math.round(e.uso*100)}% de su límite"><i class="${cls}" style="width:${Math.min(100,e.uso*100)}%"></i></span>`:''}</span></button>`;
}
function elegir(id){ sel=id; done=null; abono=String(estado(clients.find(c=>c.id===id)).saldo.toFixed(2)); hist=false; render(); }

/* ---------- detalle del cliente ---------- */
function renderDet(){
  const el=$('#colDet');
  if(!sel){ el.innerHTML=`<div class="noselect"><div class="bigi">${ic('hand',28)}</div><b style="display:block;color:var(--ink);font-family:var(--f-head);font-size:15px;margin-bottom:3px">Elige un cliente</b>Verás sus boletas pendientes y podrás registrar un pago.</div>`; return; }
  const c=clients.find(x=>x.id===sel); const e=estado(c);
  if(done){ return renderDone(el,done); }
  const lista=hist?e.bol:e.pend; const v=e.venc;
  const uso=c.limite>0?e.uso:0, ucls=uso>=1?'b':uso>=0.8?'w':'';
  el.innerHTML=`<div class="det" id="det">
    <div class="who"><span class="av ${v.length?'bad':''}">${iniciales(c.nombre)}</span><div class="grow"><h2>${esc(c.nombre)}</h2><div class="sub"><span>DNI ${c.dni}</span><span>${c.tel?c.tel:'Sin teléfono'}</span><span>Plazo ${c.dias} días</span></div></div>
      <div class="acts"><button class="btn line sm" data-a="pdf">${ic('pdf',15)} PDF</button><button class="btn line sm" data-a="wa">${ic('chat',15)} WhatsApp</button></div></div>
    <div class="debt"><div class="t"><span>Deuda actual</span><strong>${money(e.saldo)}</strong></div>
      ${c.limite>0?`<div class="meter"><i class="${ucls}" style="width:${Math.min(100,uso*100)}%"></i></div><div class="ml"><span>Usa ${money(e.saldo)} de ${money(c.limite)} de crédito (${Math.round(uso*100)}%)</span><span>Disponible ${money(Math.max(0,c.limite-e.saldo))}</span></div>`:''}
      ${v.length?`<div class="ven">${ic('warn',15)}<span><b>${money(e.vencidoMonto)} vencido.</b> La boleta ${v[0].nro} pasó su plazo hace ${v[0].diasVencido} día${v[0].diasVencido>1?'s':''}.</span></div>`:''}</div>
    <div class="panel"><div class="ph"><h3>${hist?'Historial de compras a crédito':'Boletas pendientes'}</h3>${e.bol.some(b=>b.pagada)?`<button class="link" id="tgHist">${hist?'Ver solo pendientes':`Ver historial completo (${e.bol.length})`}</button>`:''}</div>
      <div id="bols">${lista.map(b=>bolHTML(b,false)).join('')||'<div style="padding:14px 0;text-align:center;font-size:12.5px;color:var(--ok)">No hay boletas pendientes.</div>'}</div></div>
    ${PAGOS[c.id]?`<div class="panel"><div class="ph"><h3>Pagos recientes</h3></div>${PAGOS[c.id].map(p=>`<div class="hist"><span>${p[0]} · ${p[2]}</span><b>+ ${money(p[1])}</b></div>`).join('')}</div>`:''}
    <div class="pay" id="pay"><h3>Registrar pago</h3>
      <div class="amount" id="amBox"><span class="cur">S/</span><input type="number" id="iAb" inputmode="decimal" min="0" step="0.10" placeholder="0.00" value="${esc(abono)}" aria-label="Monto a abonar"></div>
      <div class="quick" id="qk"><button class="qb" data-v="${e.saldo.toFixed(2)}">Pagar todo</button><button class="qb" data-v="${r2(e.saldo/2).toFixed(2)}">Mitad</button>${e.pend[0]&&e.pend.length>1?`<button class="qb" data-v="${r2(e.pend[0].total-e.parcial).toFixed(2)}">Boleta más antigua ${money(e.pend[0].total-e.parcial)}</button>`:''}</div>
      <div id="after"></div>
      <button class="btn pri blk" id="btnPay" style="margin-top:14px">${ic('check',16)} <span id="payTxt">Registrar pago</span></button></div></div>`;
  $$('[data-a="pdf"]').forEach(b=>b.onclick=()=>toast('Descargaría el estado de cuenta en PDF.'));
  $$('[data-a="wa"]').forEach(b=>b.onclick=()=>toast('Abriría WhatsApp con el estado de cuenta.'));
  const th=$('#tgHist'); if(th) th.onclick=()=>{hist=!hist; renderDet();};
  const ia=$('#iAb'); ia.oninput=()=>{abono=ia.value; upd(c,e);};
  $$('#qk .qb').forEach(b=>b.onclick=()=>{abono=b.dataset.v; ia.value=abono; upd(c,e);});
  $('#btnPay').onclick=()=>pagar(c,e);
  upd(c,e);
}
function bolHTML(b,cov){
  return `<div class="bol ${b.pagada?'paid':''} ${cov?'cov':''}" data-n="${b.nro}"><span class="ck">${(b.pagada||cov)?ic('check',12):''}</span><div style="min-width:0;flex:1"><div class="b1"><span class="nro">${b.nro}${b.pagada?'<span class="pill ok">Pagada</span>':''}${b.vencida?`<span class="pill bad">Vencida hace ${b.diasVencido} d</span>`:''}</span><span class="tot">${money(b.total)}</span></div><div class="it">hace ${b.hace} días · ${esc(b.items)}</div></div></div>`;
}
// recalcula el pie del pago y marca qué boletas cubre
function upd(c,e){
  const ab=num(abono), rest=r2(e.saldo-ab), exc=ab>e.saldo+0.004;
  const cv=cobertura(c,Math.min(ab,e.saldo));
  $('#amBox').classList.toggle('err',exc);
  $('#after').innerHTML=`<div class="after ${exc?'bad':(ab>0&&rest<=0.004?'ok':'')}"><span>${exc?'El monto excede la deuda':'Saldo después del pago'}</span><b>${exc?money(e.saldo):money(Math.max(0,rest))}</b></div>${ab>0&&!exc&&e.pend.length?`<div class="cover">${cv.n===0?'No alcanza para cubrir una boleta completa; queda como pago a cuenta.':`Cubre ${cv.n} de ${e.pend.length} boleta${e.pend.length>1?'s':''} pendiente${e.pend.length>1?'s':''} (las más antiguas primero).`}</div>`:''}`;
  $$('#qk .qb').forEach(b=>b.classList.toggle('on',Math.abs(num(b.dataset.v)-ab)<0.005));
  $$('#bols .bol').forEach(x=>{ if(!hist||!x.classList.contains('paid')) x.classList.toggle('cov',ab>0&&!exc&&cv.ids.includes(x.dataset.n)); const ck=x.querySelector('.ck'); if(!x.classList.contains('paid')) ck.innerHTML=x.classList.contains('cov')?ic('check',12):''; });
  const bt=$('#btnPay'); bt.disabled=!(ab>0)||exc;
  $('#payTxt').textContent=ab>0&&!exc?`Registrar pago de ${money(ab)}`:'Registrar pago';
}
function pagar(c,e){
  const ab=num(abono); if(!(ab>0)||ab>e.saldo+0.004) return;
  const antes=e.saldo; c.pagado=r2(c.pagado+ab); const despues=estado(c).saldo;
  (PAGOS[c.id]=PAGOS[c.id]||[]).unshift(['hoy',ab,'Luis Torres']);
  done={nombre:c.nombre,ab,antes,despues}; render();
}
function renderDone(el,d){
  const rest=deudores().filter(x=>x.c.id!==sel);
  el.innerHTML=`<div class="det"><div class="fin"><div class="big">${ic('check',38)}</div><h2>Pago registrado</h2><p>${esc(d.nombre)} ${d.despues<=0.004?'quedó sin deuda.':'sigue debiendo '+money(d.despues)+'.'}</p>
    <div class="sumr"><div class="r"><span>Deuda anterior</span><b>${money(d.antes)}</b></div><div class="r"><span>Pago recibido</span><b style="color:var(--ok)">+ ${money(d.ab)}</b></div><div class="r"><span>Deuda actual</span><b style="font-family:var(--f-head);font-size:16px">${money(d.despues)}</b></div></div>
    <div class="btns">${rest.length?`<button class="btn pri blk" id="sig">Siguiente cliente ${ic('next',15)}</button>`:''}<button class="btn sec blk" id="vol">Volver a la lista</button></div></div></div>`;
  const s=$('#sig'); if(s) s.onclick=()=>{ const n=rest.sort((a,b)=>b.e.saldo-a.e.saldo)[0]; elegir(n.c.id); };
  $('#vol').onclick=()=>{sel=null; done=null; render();};
}

let tT; function toast(m){const t=$('#toast'); if(!t) return; t.textContent=m; t.classList.add('on'); clearTimeout(tT); tT=setTimeout(()=>t.classList.remove('on'),2300);}
function reset(){ clients=data==='con'?clone(SEED):[]; sel=null; q=''; filtro='todos'; orden='deuda'; abono=''; done=null; hist=false; render(); }
$$('#tgData button').forEach(b=>b.onclick=()=>{data=b.dataset.v; $$('#tgData button').forEach(x=>x.classList.toggle('on',x===b)); reset();});
$$('#tgView button').forEach(b=>b.onclick=()=>{$$('#tgView button').forEach(x=>x.classList.toggle('on',x===b)); $('#stage').classList.toggle('mobile',b.dataset.v==='mobile');});
$('#btnReset').onclick=reset;
reset();
</script>
</body>
</html>
