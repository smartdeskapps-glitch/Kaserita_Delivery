<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maqueta · Historial de ventas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --p:#6105dc; --p-dark:#4d04b0; --p-soft:#f4eefe; --p-line:#e4d6fb; --p-ring:rgba(97,5,220,.16);
  --ink:#1c1830; --mut:#78729a; --line:#ece7f5; --card:#fff;
  --ok:#059669; --ok-soft:#e8f8f1; --warn:#b45309; --warn-soft:#fff4e0; --bad:#e11d48; --bad-soft:#fff0f3;
  --f-head:'Plus Jakarta Sans',system-ui,sans-serif; --f-body:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{font-family:var(--f-body);color:var(--ink);background:#e9e4f5;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}
em{font-style:normal;color:var(--mut);font-weight:500}
.ic{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* ---- barra de la maqueta ---- */
.bar{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;justify-content:space-between;padding:10px 20px;background:#1c1830;color:#fff;font-size:12.5px}
.bar b{font-family:var(--f-head);font-size:13.5px}
.bar .grp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bar .tog{display:inline-flex;background:rgba(255,255,255,.1);border-radius:999px;padding:3px}
.bar .tog button{background:none;border:0;color:#d9d2ee;padding:5px 13px;border-radius:999px;font-size:12px;font-weight:600}
.bar .tog button.on{background:#fff;color:#1c1830}
.bar .reset{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:999px;padding:5px 13px;font-size:12px}

.stage{display:flex;justify-content:center;padding:22px 14px 40px}
.modal{container-type:inline-size;container-name:m;position:relative;width:min(1040px,100%);height:min(790px,calc(100vh - 110px));min-height:640px;background:linear-gradient(150deg,#f4effc,#f9f8fb 55%,#f5f4f8);border:1px solid #fff;border-radius:28px;box-shadow:0 30px 70px -20px rgba(60,20,120,.35);display:flex;flex-direction:column;overflow:hidden}
.stage.mobile .modal{width:390px;height:790px;border-radius:34px;border:8px solid #1c1830;box-shadow:0 30px 70px -20px rgba(0,0,0,.5)}

.head{background:#fff;border-bottom:1px solid var(--line);padding:14px 20px;flex-shrink:0;display:flex;align-items:center;gap:14px}
.head .tile{width:44px;height:44px;border-radius:14px;background:var(--p-soft);color:var(--p);display:grid;place-items:center;font-size:22px;flex-shrink:0}
.head h1{margin:0;font-family:var(--f-head);font-size:18px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.head p{margin:2px 0 0;font-size:12.5px;color:var(--mut)}
.grow{min-width:0;flex:1}
.tabs{display:inline-flex;background:#f1eef9;border-radius:12px;padding:3px;gap:2px;flex-shrink:0}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:10px;font-size:12.5px;font-weight:700;color:var(--mut)}
.tabs button.on{background:#fff;color:var(--p-dark);box-shadow:0 2px 8px -2px rgba(40,10,90,.2)}
.x{width:34px;height:34px;border:0;background:none;border-radius:50%;color:var(--mut);display:grid;place-items:center;flex-shrink:0}
.x:hover{background:#f3f0fa;color:var(--ink)}
.backm{display:none;border:0;background:none;color:var(--mut);font-size:12.5px;font-weight:700;padding:4px 8px 4px 2px;border-radius:8px;align-items:center;gap:6px}

.split{flex:1;min-height:0;display:grid;grid-template-columns:420px minmax(0,1fr)}
.col{min-height:0;display:flex;flex-direction:column}
.list{border-right:1px solid var(--line);background:rgba(255,255,255,.55)}
.scroll{flex:1;min-height:0;overflow-y:auto}

/* rango y resumen */
.range{padding:14px 16px 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:all .15s}
.chip:hover{border-color:var(--p-line);background:var(--p-soft)}
.chip.on{border-color:var(--p);background:var(--p-soft);color:var(--p-dark);box-shadow:0 0 0 3px var(--p-ring)}
.chip .n{font-size:10.5px;background:#f1eef9;color:var(--mut);border-radius:99px;padding:1px 6px}
.chip.on .n{background:var(--p);color:#fff}
.chip .dot{width:8px;height:8px;border-radius:50%}
.dates{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.dates input{height:34px;border:1.5px solid #e6e0f2;background:#fff;border-radius:11px;padding:0 10px;font-size:12.5px;outline:0}
.dates input:focus{border-color:var(--p);box-shadow:0 0 0 3px var(--p-ring)}
.dates span{font-size:12px;color:var(--mut)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:10px 16px 4px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:9px 12px;min-width:0}
.kpi span{font-size:11px;font-weight:700;color:var(--mut);display:block}
.kpi b{font-family:var(--f-head);font-size:18px;font-weight:800;letter-spacing:-.01em;display:block;margin-top:1px;white-space:nowrap}
.kpi.main{background:var(--p-soft);border-color:var(--p-line)} .kpi.main span{color:var(--p)} .kpi.main b{color:var(--p-dark);font-size:22px}
.kpi.ok b{color:var(--ok)}
.mix{padding:8px 16px 2px}
.mixbar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:#ece7f5}
.mixbar i{display:block;height:100%}
.mixleg{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:7px;font-size:11px;color:var(--mut);font-weight:600}
.mixleg span{display:inline-flex;align-items:center;gap:5px}
.mixleg b{color:var(--ink);font-weight:700}
.dot2{width:8px;height:8px;border-radius:3px;display:inline-block}
.search{position:relative;padding:8px 16px 4px}
.search .lupa{position:absolute;left:29px;top:50%;transform:translateY(-35%);color:#b5afcb;font-size:15px;pointer-events:none;display:grid;place-items:center;width:18px;height:18px}
.search input{width:100%;height:40px;border:1.5px solid #e6e0f2;background:#fff;border-radius:14px;padding:0 14px 0 38px;font-size:13.5px;outline:0}
.search input:focus{border-color:var(--p);box-shadow:0 0 0 4px var(--p-ring)}
.fl{padding:6px 16px 4px}
.cnt{display:flex;justify-content:space-between;align-items:center;padding:4px 16px 6px;font-size:11.5px;color:var(--mut);font-weight:600}
.cnt button{border:0;background:none;color:var(--p-dark);font-size:11.5px;font-weight:700;padding:3px 6px;border-radius:8px;display:inline-flex;gap:5px;align-items:center}
.cnt button:hover{background:var(--p-soft)}

/* lista por día */
.rows{padding:0 10px 14px}
.dayh{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:8px 8px 6px;background:linear-gradient(#f7f3fd 80%,rgba(247,243,253,0));font-size:11.5px;font-weight:800;color:var(--mut);letter-spacing:.02em}
.dayh b{font-family:var(--f-head);color:var(--ink);font-size:12.5px}
.row{display:flex;align-items:center;gap:11px;border:1.5px solid transparent;background:#fff;border-radius:16px;padding:9px 11px;text-align:left;width:100%;transition:all .15s;margin-bottom:5px}
.row:hover{border-color:var(--p-line);background:#fcfaff}
.row.on{border-color:var(--p);background:#fcfaff;box-shadow:0 0 0 3px var(--p-ring)}
.pm{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:16px;flex-shrink:0;color:#fff}
.row .nm{font-size:13px;font-weight:700;display:block;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .mt{font-size:11.5px;color:var(--mut);display:block;margin-top:2px}
.row .amt{margin-left:auto;text-align:right;flex-shrink:0}
.row .amt strong{display:block;font-family:var(--f-head);font-size:14px;font-weight:800;letter-spacing:-.01em}
.row.anul{opacity:.55}
.row.anul .amt strong{text-decoration:line-through}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--p-soft);color:var(--p-dark);white-space:nowrap}
.tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.gray{background:#f1eef9;color:var(--mut)}
.empty{margin:36px auto;text-align:center;max-width:290px;color:var(--mut);font-size:13.5px;line-height:1.5;padding:0 16px}
.empty .bigi{width:72px;height:72px;border-radius:24px;background:var(--p-soft);color:var(--p);display:grid;place-items:center;font-size:32px;margin:0 auto 12px}
.empty b{display:block;color:var(--ink);font-family:var(--f-head);font-size:16px;margin-bottom:3px}

/* detalle */
.det{padding:18px 20px;overflow-y:auto;flex:1;min-height:0}
.ticket{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:14px;position:relative}
.ticket.anul{background:#fffafb;border-color:#f7c7d1}
.tk-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tk-h .pm{width:44px;height:44px;font-size:20px;border-radius:14px}
.tk-h h2{margin:0;font-family:var(--f-head);font-size:19px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.tk-h .sub{font-size:12.5px;color:var(--mut);margin-top:2px}
.tk-total{margin-left:auto;text-align:right}
.tk-total small{display:block;font-size:11px;font-weight:700;color:var(--mut)}
.tk-total strong{font-family:var(--f-head);font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.ticket.anul .tk-total strong{text-decoration:line-through;color:#b5afcb}
.meta{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 18px;margin:16px 0 4px;padding:14px 0;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line)}
.meta div span{font-size:11px;font-weight:700;color:var(--mut);display:block}
.meta div b{font-size:13.5px;font-weight:700;display:block;margin-top:1px}
.it{display:flex;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.it:last-of-type{border-bottom:0}
.it .q{font-weight:800;color:var(--p-dark);min-width:30px}
.it .d{flex:1;min-width:0;line-height:1.35}
.it .d small{display:block;color:var(--mut);font-size:11.5px}
.it .s{font-family:var(--f-head);font-weight:800;white-space:nowrap}
.sumr{padding-top:10px;margin-top:4px;border-top:2px dashed var(--p-line)}
.sumr .r{display:flex;justify-content:space-between;padding:4px 0;font-size:13px}
.sumr .r span{color:var(--mut);font-weight:600}
.sumr .r.t b{font-family:var(--f-head);font-size:18px;font-weight:800}
.motivo{display:flex;gap:9px;align-items:flex-start;border-radius:14px;padding:11px 13px;font-size:12.5px;line-height:1.45;background:var(--bad-soft);color:var(--bad);margin-top:14px}
.motivo svg{margin-top:2px}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.btn{height:44px;border-radius:14px;border:0;padding:0 18px;font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:all .15s;white-space:nowrap}
.btn.pri{background:var(--p);color:#fff;box-shadow:0 8px 18px -8px rgba(97,5,220,.6)} .btn.pri:hover{background:var(--p-dark)}
.btn.sec{background:var(--p-soft);color:var(--p-dark)} .btn.sec:hover{background:#ece0fd}
.btn.line{background:#fff;border:1.5px solid var(--line);color:var(--ink)} .btn.line:hover{border-color:var(--p-line);background:var(--p-soft)}
.btn.dng{background:var(--bad-soft);color:var(--bad)} .btn.dng:hover{background:#ffe1e7}
.btn.red{background:var(--bad);color:#fff} .btn.red:hover{background:#be123c}
.btn.gho{background:none;color:var(--mut)} .btn.gho:hover{background:#f3f0fa;color:var(--ink)}
.btn.sm{height:38px;padding:0 14px;font-size:12.5px;border-radius:12px}
.acts .grow{flex:1}
.noselect{margin:auto;text-align:center;color:var(--mut);font-size:13.5px;max-width:270px;line-height:1.5;padding:20px}
.noselect .bigi{width:64px;height:64px;border-radius:20px;background:var(--p-soft);color:var(--p);display:grid;place-items:center;font-size:28px;margin:0 auto 10px}

/* diálogo */
.ov{position:absolute;inset:0;z-index:60;background:rgba(20,10,40,.55);backdrop-filter:blur(4px);display:grid;place-items:center;padding:20px}
.dlg{background:#fff;border-radius:24px;padding:22px;max-width:400px;width:100%;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.dlg .ico{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-size:22px;margin-bottom:12px;background:var(--bad-soft);color:var(--bad)}
.dlg h3{margin:0 0 6px;font-family:var(--f-head);font-size:18px;font-weight:800}
.dlg p{margin:0 0 14px;font-size:13px;color:var(--mut);line-height:1.5}
.dlg input{width:100%;height:44px;border:1.5px solid #e6e0f2;background:#fbfaff;border-radius:14px;padding:0 14px;font-size:14px;outline:0;margin-bottom:14px}
.dlg input:focus{border-color:var(--p);background:#fff;box-shadow:0 0 0 4px var(--p-ring)}
.dlg .acts2{display:flex;gap:8px;justify-content:flex-end}
.dlg .btn{height:42px}
.qr{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 12px}
.qr button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font-size:11.5px;font-weight:600}
.qr button:hover{background:var(--p-soft);border-color:var(--p-line)}
.toast{position:absolute;left:50%;bottom:20px;transform:translate(-50%,20px);background:#1c1830;color:#fff;padding:10px 16px;border-radius:14px;font-size:12.5px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s;z-index:70;max-width:88%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

@container m (max-width:820px){
  .split{grid-template-columns:minmax(0,1fr)}
  .list{border-right:0}
  .split.det-open .list{display:none}
  .split:not(.det-open) .detcol{display:none}
  .head{padding:12px 14px;gap:10px}.head .tile{width:38px;height:38px;font-size:19px}.head h1{font-size:16px}.head p{display:none}
  .head .tabs{display:none}
  .backm{display:inline-flex}
  .det{padding:14px}
  .ticket{padding:16px}
  .tk-total strong{font-size:26px}
  .acts .btn{flex:1}
}
</style>
</head>
<body>

<div class="bar">
  <div class="grp"><b>Maqueta · Historial de ventas</b><span style="opacity:.7">propuesta de rediseño, no es el módulo real</span></div>
  <div class="grp">
    <span>Quién lo usa</span>
    <div class="tog" id="tgRol"><button data-v="admin" class="on">Administrador</button><button data-v="cajero">Cajero</button></div>
    <span>Vista</span>
    <div class="tog" id="tgView"><button data-v="desk" class="on">Escritorio</button><button data-v="mobile">Celular</button></div>
    <button class="reset" id="btnReset">Reiniciar</button>
  </div>
</div>

<div class="stage" id="stage"><div class="modal" id="modal"></div></div>

<script>
/* ---------- datos de ejemplo ---------- */
// dia: 0 = hoy, 1 = ayer, ... ; items: [descripción, cantidad, precio, costo]
const V=[
 {id:1,dia:0,h:'09:12',nro:'B001-0585',cli:'Cliente general',pm:'EFECTIVO',cj:'Luis Torres',items:[['Pan francés x10',2,3.5,2.4],['Leche Gloria 400g',3,4.8,3.9]]},
 {id:2,dia:0,h:'09:48',nro:'B001-0586',cli:'Rosa Mendoza Vega',pm:'CREDITO',cj:'Luis Torres',items:[['Arroz Costeño 5kg',1,23,19.5],['Aceite Primor 1L',2,12.5,9.8],['Azúcar rubia 1kg',2,4.2,3.4]]},
 {id:3,dia:0,h:'10:30',nro:'B001-0587',cli:'Cliente general',pm:'YAPE',cj:'María Quispe',items:[['Gaseosa Inca Kola 1.5L',2,7.5,6.2],['Galleta Soda Field',4,1.5,1.1]]},
 {id:4,dia:0,h:'11:05',nro:'B001-0588',cli:'Cliente general',pm:'TARJETA',cj:'Luis Torres',items:[['Detergente Ariel 800g',1,15.9,12.3],['Lejía Clorox 1L',1,6.5,4.9],['Papel higiénico Elite x4',2,7.9,6.1]]},
 {id:5,dia:0,h:'11:42',nro:'B001-0589',cli:'Carlos Huamán Pérez',pm:'MIXTO',ef:20,otro:15.5,cj:'María Quispe',items:[['Combo Desayuno',1,21.9,17.4],['Café Altomayo 50g',2,6.9,5.1]]},
 {id:6,dia:0,h:'12:20',nro:'B001-0590',cli:'Cliente general',pm:'EFECTIVO',cj:'Luis Torres',items:[['Huevos San Fernando x30',1,16.5,13.8]]},
 {id:7,dia:0,h:'13:03',nro:'B001-0591',cli:'Cliente general',pm:'PLIN',cj:'Luis Torres',items:[['Agua San Luis 625ml',6,1.8,1.2],['Galleta Soda Field',6,1.5,1.1]],anul:true,motivo:'El cliente se arrepintió'},
 {id:8,dia:0,h:'13:41',nro:'B001-0592',cli:'Cliente general',pm:'EFECTIVO',cj:'María Quispe',items:[['Pollo entero (kg)',2.4,8.5,7.2],['Palta Hass (kg)',0.8,12.9,9.5]],desc:1.5},
 {id:9,dia:1,h:'08:55',nro:'B001-0571',cli:'Rosa Mendoza Vega',pm:'CREDITO',cj:'Luis Torres',items:[['Pan francés x10',2,3.5,2.4],['Mantequilla',2,7.2,5.9]]},
 {id:10,dia:1,h:'10:10',nro:'B001-0572',cli:'Cliente general',pm:'EFECTIVO',cj:'María Quispe',items:[['Gaseosa Inca Kola 1.5L',1,7.5,6.2]]},
 {id:11,dia:1,h:'12:35',nro:'B001-0573',cli:'Cliente general',pm:'YAPE',cj:'Luis Torres',items:[['Arroz Costeño 5kg',2,23,19.5],['Aceite Primor 1L',1,12.5,9.8]]},
 {id:12,dia:1,h:'17:20',nro:'B001-0574',cli:'Cliente general',pm:'TARJETA',cj:'María Quispe',items:[['Cerveza Pilsen x6',1,32,26.5]]},
 {id:13,dia:3,h:'09:30',nro:'B001-0540',cli:'Jorge Quispe Lara',pm:'CREDITO',cj:'Luis Torres',items:[['Abarrotes surtidos',1,60.5,48]]},
 {id:14,dia:3,h:'16:48',nro:'B001-0541',cli:'Cliente general',pm:'EFECTIVO',cj:'Luis Torres',items:[['Leche Gloria 400g',6,4.8,3.9]]},
 {id:15,dia:6,h:'11:15',nro:'B001-0512',cli:'Cliente general',pm:'EFECTIVO',cj:'María Quispe',items:[['Detergente Ariel 800g',2,15.9,12.3]]}
];
V.forEach(v=>{v.sub=r2(v.items.reduce((a,i)=>a+i[1]*i[2],0)); v.total=r2(v.sub-(v.desc||0)); v.util=r2(v.total-v.items.reduce((a,i)=>a+i[1]*i[3],0)); if(v.pm==='MIXTO'&&v.ef==null){v.ef=r2(v.total/2);v.otro=r2(v.total-v.ef);} });
function r2(n){return Math.round(n*100)/100}
const PM={EFECTIVO:{n:'Efectivo',c:'#059669',i:'cash'},YAPE:{n:'Yape',c:'#7c3aed',i:'phone'},PLIN:{n:'Plin',c:'#06b6d4',i:'phone'},TARJETA:{n:'Tarjeta',c:'#f59e0b',i:'card'},CREDITO:{n:'Fiado',c:'#e11d48',i:'hand'},MIXTO:{n:'Mixto',c:'#64748b',i:'split'}};

/* ---------- estado ---------- */
let ventas, rol='admin', rango='hoy', desde=0, hasta=0, q='', fpm='todos', sel=null, tab='ventas';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=v=>'S/ '+Number(v||0).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2});
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const isAdmin=()=>rol==='admin';
const hoyD=new Date();
const fechaDe=d=>{const x=new Date(hoyD); x.setDate(x.getDate()-d); return x;};
const iso=d=>{const x=fechaDe(d); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');};
const etiquetaDia=d=>{if(d===0) return 'Hoy'; if(d===1) return 'Ayer'; const t=fechaDe(d).toLocaleDateString('es-PE',{weekday:'long',day:'numeric',month:'long'}); return t.charAt(0).toUpperCase()+t.slice(1);};

const ICO={
  receipt:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/>', x:'<path d="M6 6l12 12M18 6L6 18"/>', check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>', back:'<path d="M15 5l-7 7 7 7"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>', print:'<path d="M7 9V4h10v5M7 17H5a1 1 0 01-1-1v-5a2 2 0 012-2h12a2 2 0 012 2v5a1 1 0 01-1 1h-2M7 14h10v6H7z"/>',
  xl:'<path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8zM14 2v6h6M9 13l5 5M14 13l-5 5"/>',
  cash:'<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>', phone:'<rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/>',
  card:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h3"/>', hand:'<path d="M11 15h2a2 2 0 100-4h-3c-.6 0-1.1.2-1.4.6L3 16M7 21l1.6-1.4c.3-.4.8-.6 1.4-.6h4c1.1 0 2.1-.4 2.8-1.2l4.6-4.4a2 2 0 00-2.75-2.91l-4.2 3.9M2 16l6 6"/><circle cx="16" cy="9" r="2.9"/>',
  split:'<path d="M12 3v18M5 8l7-5 7 5M5 16l7 5 7-5"/>', warn:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.01"/>', info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.01"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', sort:'<path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4"/>'
};
const ic=(n,sz)=>`<svg class="ic" viewBox="0 0 24 24"${sz?` style="width:${sz}px;height:${sz}px"`:''}>${ICO[n]}</svg>`;

/* ---------- cálculos ---------- */
function enRango(){
  let a=0,b=0;
  if(rango==='hoy'){a=0;b=0;} else if(rango==='ayer'){a=1;b=1;} else if(rango==='7'){a=6;b=0;} else if(rango==='mes'){a=29;b=0;} else {a=desde;b=hasta;}
  return ventas.filter(v=>v.dia<=a&&v.dia>=b);
}
const activas=L=>L.filter(v=>!v.anul);
function resumen(L){
  const A=activas(L), total=r2(A.reduce((s,v)=>s+v.total,0)), util=r2(A.reduce((s,v)=>s+v.util,0));
  const por={}; A.forEach(v=>{ if(v.pm==='MIXTO'){ por.EFECTIVO=(por.EFECTIVO||0)+v.ef; por.OTRO=(por.OTRO||0)+v.otro; } else por[v.pm]=(por[v.pm]||0)+v.total; });
  return {n:A.length,total,util,ticket:A.length?r2(total/A.length):0,por,anul:L.length-A.length};
}

/* ---------- pantalla ---------- */
function render(){
  const L=enRango();
  $('#modal').innerHTML=`
  <div class="head">${sel?`<button class="backm" id="mBack">${ic('back',14)} Ventas</button>`:''}<div class="tile">${ic('receipt',22)}</div><div class="grow"><h1>Historial de ventas</h1><p>Busca una boleta, revisa qué se vendió y quién cobró. Reimprime o anula desde aquí.</p></div>
    ${isAdmin()?`<div class="tabs"><button class="on">Ventas</button><button id="tCierres">Cierres de caja</button></div>`:''}
    <button class="x" id="btnX" aria-label="Cerrar">${ic('x',18)}</button></div>
  <div class="split ${sel?'det-open':''}"><div class="col list" id="colList"></div><div class="col detcol" id="colDet"></div></div><div class="ov" id="ov" hidden></div><div class="toast" id="toast"></div>`;
  $('#btnX').onclick=()=>toast('Se cerraría el módulo.');
  const tc=$('#tCierres'); if(tc) tc.onclick=()=>toast('Abriría el historial de cierres de caja.');
  const mb=$('#mBack'); if(mb) mb.onclick=()=>{sel=null; render();};
  renderList(L); renderDet();
}
function renderList(L){
  const el=$('#colList'), R=resumen(L);
  const filtrada=L.filter(v=>(fpm==='todos'||(fpm==='anul'?v.anul:v.pm===fpm&&!v.anul))&&(!q||norm(v.nro).includes(norm(q))||norm(v.cli).includes(norm(q))||v.items.some(i=>norm(i[0]).includes(norm(q)))));
  const cuenta=k=>k==='todos'?L.length:k==='anul'?L.filter(v=>v.anul).length:L.filter(v=>v.pm===k&&!v.anul).length;
  const mixTot=Object.values(R.por).reduce((a,b)=>a+b,0)||1;
  const orden=Object.entries(R.por).sort((a,b)=>b[1]-a[1]);
  const col=k=>k==='OTRO'?'#94a3b8':PM[k].c, nom=k=>k==='OTRO'?'Otros':PM[k].n;
  // agrupar por día
  const dias=[...new Set(filtrada.map(v=>v.dia))].sort((a,b)=>a-b);
  el.innerHTML=`
  <div class="range"><div class="chips" id="rg">${[['hoy','Hoy'],['ayer','Ayer'],['7','7 días'],['mes','Este mes'],['otro','Otro rango']].map(([k,t])=>`<button class="chip ${rango===k?'on':''}" data-r="${k}">${t}</button>`).join('')}</div>
   ${rango==='otro'?`<div class="dates"><input type="date" id="dDesde" value="${iso(desde)}"><span>a</span><input type="date" id="dHasta" value="${iso(hasta)}"></div>`:''}</div>
  <div class="kpis"><div class="kpi main" style="grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;padding:8px 14px"><div><span>Total vendido</span><b>${money(R.total)}</b></div><div style="text-align:right"><span>${R.n} venta${R.n===1?'':'s'}</span><span style="font-weight:600">Promedio ${money(R.ticket)}</span></div></div></div>
  <div class="search"><span class="lupa">${ic('search',15)}</span><input type="text" id="q" placeholder="Boleta, cliente o producto…" value="${esc(q)}" autocomplete="off"></div>
  <div class="fl"><div class="chips" id="fp">${[['todos','Todas'],['EFECTIVO','Efectivo'],['YAPE','Yape'],['PLIN','Plin'],['TARJETA','Tarjeta'],['CREDITO','Fiado'],['MIXTO','Mixto'],['anul','Anuladas']].filter(([k])=>k==='todos'||cuenta(k)>0).map(([k,t])=>`<button class="chip ${fpm===k?'on':''}" data-f="${k}">${k!=='todos'&&k!=='anul'?`<i class="dot" style="background:${PM[k].c}"></i>`:''}${t} <span class="n">${cuenta(k)}</span></button>`).join('')}</div></div>
  <div class="cnt"><span>${filtrada.length} resultado${filtrada.length===1?'':'s'}</span>${isAdmin()&&L.length?`<button id="xl">${ic('xl',14)} Exportar a Excel</button>`:''}</div>
  <div class="scroll"><div class="rows" id="rows">${filtrada.length?dias.map(d=>{const dl=filtrada.filter(v=>v.dia===d), s=r2(activas(dl).reduce((a,v)=>a+v.total,0)); return `<div class="dayh"><b>${etiquetaDia(d)}</b><span>${activas(dl).length} venta${activas(dl).length===1?'':'s'} · ${money(s)}</span></div>`+dl.map(rowHTML).join('');}).join(''):`<div class="empty"><div class="bigi">${ic('receipt',32)}</div><b>${L.length?'Nada coincide':'No hay ventas en este rango'}</b>${L.length?'Prueba con otro filtro o palabra.':'Cambia el rango de fechas para ver otras ventas.'}</div>`}</div></div>`;
  $$('#rg .chip').forEach(b=>b.onclick=()=>{rango=b.dataset.r; if(rango==='otro'){desde=6;hasta=0;} sel=null; render();});
  const dd=$('#dDesde'),dh=$('#dHasta'); const calc=s=>Math.round((new Date(iso(0)+'T00:00')-new Date(s+'T00:00'))/86400000);
  if(dd){dd.onchange=()=>{desde=Math.max(0,calc(dd.value)); render();}; dh.onchange=()=>{hasta=Math.max(0,calc(dh.value)); render();};}
  const qi=$('#q'); qi.oninput=()=>{q=qi.value; const p=qi.selectionStart; render(); const n=$('#q'); n.focus(); n.setSelectionRange(p,p);};
  $$('#fp .chip').forEach(b=>b.onclick=()=>{fpm=b.dataset.f; render();});
  $$('#rows .row').forEach(b=>b.onclick=()=>{sel=+b.dataset.id; render();});
  const xl=$('#xl'); if(xl) xl.onclick=()=>toast('Descargaría Ventas_'+iso(rango==='hoy'?0:6)+'.xlsx');
}
function rowHTML(v){
  const p=PM[v.pm];
  return `<button class="row ${sel===v.id?'on':''} ${v.anul?'anul':''}" data-id="${v.id}"><span class="pm" style="background:${p.c}">${ic(p.i,17)}</span><span style="min-width:0"><span class="nm">${esc(v.cli)}</span><span class="mt">${v.h} · ${v.nro}${v.anul?' · <b style="color:var(--bad)">Anulada</b>':''}</span></span><span class="amt"><strong>${money(v.total)}</strong><span class="tag gray" style="margin-top:3px">${p.n}</span></span></button>`;
}

/* ---------- resumen del período (panel derecho) ---------- */
function resumenHTML(){
  const L=enRango(), R=resumen(L), A=activas(L);
  if(!A.length) return `<div class="noselect"><div class="bigi">${ic('receipt',28)}</div><b style="display:block;color:var(--ink);font-family:var(--f-head);font-size:15px;margin-bottom:3px">Sin ventas en este rango</b>Cuando haya ventas, aquí verás el resumen.</div>`;
  const mixTot=Object.values(R.por).reduce((a,b)=>a+b,0)||1, orden=Object.entries(R.por).sort((a,b)=>b[1]-a[1]);
  const col=k=>k==='OTRO'?'#94a3b8':PM[k].c, nom=k=>k==='OTRO'?'Otros (parte de pagos mixtos)':PM[k].n;
  const prod={}; A.forEach(v=>v.items.forEach(i=>{prod[i[0]]=(prod[i[0]]||0)+i[1]*i[2];}));
  const top=Object.entries(prod).sort((a,b)=>b[1]-a[1]).slice(0,4);
  const maxP=top[0]?top[0][1]:1;
  return `<div class="det"><div class="ticket"><div class="tk-h"><div class="grow"><h2>Resumen del período</h2><div class="sub">Toca una venta de la lista para ver su boleta.</div></div><div class="tk-total"><small>Total vendido</small><strong>${money(R.total)}</strong></div></div>
    <div class="meta" style="grid-template-columns:repeat(${isAdmin()?4:2},1fr)"><div><span>Ventas</span><b>${R.n}</b></div><div><span>Promedio</span><b>${money(R.ticket)}</b></div>${isAdmin()?`<div><span>Ganancia</span><b style="color:var(--ok)">${money(R.util)}</b></div><div><span>Margen</span><b>${R.total?Math.round(R.util/R.total*100):0}%</b></div>`:''}</div>
    <div style="font-size:12px;font-weight:800;color:var(--mut);margin:4px 0 8px">Cómo te pagaron</div>
    <div class="mixbar" style="height:12px">${orden.map(([k,v])=>`<i style="width:${v/mixTot*100}%;background:${col(k)}"></i>`).join('')}</div>
    <div style="margin-top:8px">${orden.map(([k,v])=>`<div class="it"><span class="q" style="min-width:20px"><i class="dot2" style="background:${col(k)}"></i></span><span class="d">${nom(k)}</span><span style="color:var(--mut);font-size:12px;font-weight:600;min-width:42px;text-align:right">${Math.round(v/mixTot*100)}%</span><span class="s" style="min-width:90px;text-align:right">${money(v)}</span></div>`).join('')}</div>
    <div style="font-size:12px;font-weight:800;color:var(--mut);margin:14px 0 8px">Lo más vendido</div>
    ${top.map(([n,v])=>`<div style="margin-bottom:9px"><div style="display:flex;justify-content:space-between;font-size:13px;font-weight:600;gap:10px"><span>${esc(n)}</span><b style="font-family:var(--f-head)">${money(v)}</b></div><div class="mixbar" style="height:6px;margin-top:4px"><i style="width:${v/maxP*100}%;background:var(--p)"></i></div></div>`).join('')}
    ${R.anul?`<div class="motivo" style="background:#f7f4fc;color:var(--mut)">${ic('info',16)}<span>${R.anul} venta${R.anul===1?'':'s'} anulada${R.anul===1?'':'s'} en este rango (no suma${R.anul===1?'':'n'} al total).</span></div>`:''}
  </div></div>`;
}

/* ---------- detalle de la boleta ---------- */
function renderDet(){
  const el=$('#colDet');
  const v=ventas.find(x=>x.id===sel);
  if(!v){ el.innerHTML=resumenHTML(); return; }
  const p=PM[v.pm];
  el.innerHTML=`<div class="det"><div class="ticket ${v.anul?'anul':''}">
    <div class="tk-h"><span class="pm" style="background:${p.c}">${ic(p.i,20)}</span><div class="grow"><h2>${v.nro}</h2><div class="sub">${etiquetaDia(v.dia)==='Hoy'||etiquetaDia(v.dia)==='Ayer'?etiquetaDia(v.dia):fechaDe(v.dia).toLocaleDateString('es-PE',{day:'numeric',month:'long'})} · ${v.h}${v.anul?' · <b style="color:var(--bad)">Anulada</b>':''}</div></div>
      <div class="tk-total"><small>Total</small><strong>${money(v.total)}</strong></div></div>
    <div class="meta"><div><span>Cliente</span><b>${esc(v.cli)}</b></div><div><span>Atendió</span><b>${esc(v.cj)}</b></div>
      <div><span>Pagó con</span><b>${p.n}${v.pm==='MIXTO'?` <span style="font-weight:500;color:var(--mut)">· ${money(v.ef)} efectivo + ${money(v.otro)} otro</span>`:''}</b></div>
      ${isAdmin()?`<div><span>Ganancia</span><b style="color:${v.util>=0?'var(--ok)':'var(--bad)'}">${money(v.util)}</b></div>`:`<div><span>Productos</span><b>${v.items.length}</b></div>`}</div>
    <div>${v.items.map(i=>`<div class="it"><span class="q">${i[1]}×</span><span class="d">${esc(i[0])}<small>${money(i[2])} c/u</small></span><span class="s">${money(i[1]*i[2])}</span></div>`).join('')}</div>
    <div class="sumr">${v.desc?`<div class="r"><span>Subtotal</span><span>${money(v.sub)}</span></div><div class="r"><span>Descuento</span><span style="color:var(--ok);font-weight:700">− ${money(v.desc)}</span></div>`:''}<div class="r t"><span style="color:var(--ink)">Total</span><b>${money(v.total)}</b></div></div>
    ${v.anul?`<div class="motivo">${ic('warn',16)}<span><b>Boleta anulada.</b> Motivo: ${esc(v.motivo||'Sin motivo especificado')}. El stock se repuso${v.pm==='CREDITO'?' y la deuda del cliente se revirtió':''}.</span></div>`:''}
  </div>
  <div class="acts"><button class="btn pri grow" id="aPrint">${ic('print',16)} Reimprimir boleta</button>${isAdmin()&&!v.anul?`<button class="btn dng" id="aAnular">Anular venta</button>`:''}</div></div>`;
  $('#aPrint').onclick=()=>toast('Abriría la boleta '+v.nro+' para imprimir.');
  const an=$('#aAnular'); if(an) an.onclick=()=>anular(v);
}

/* ---------- anular ---------- */
function anular(v){
  const o=$('#ov'); o.hidden=false;
  o.innerHTML=`<div class="dlg"><div class="ico">${ic('warn',22)}</div><h3>¿Anular la boleta ${v.nro}?</h3><p>Se devuelve el stock${v.pm==='CREDITO'?' y se descuenta la deuda del cliente':''}. Esta acción no se puede deshacer.</p>
   <input type="text" id="mot" placeholder="Motivo (opcional)" autocomplete="off"><div class="qr">${['El cliente se arrepintió','Error de precio','Producto equivocado','Venta duplicada'].map(t=>`<button data-t="${t}">${t}</button>`).join('')}</div>
   <div class="acts2"><button class="btn gho" id="dNo">Cancelar</button><button class="btn red" id="dOk">Sí, anular</button></div></div>`;
  $$('.qr button').forEach(b=>b.onclick=()=>{$('#mot').value=b.dataset.t; $('#mot').focus();});
  $('#dNo').onclick=()=>{o.hidden=true}; $('#dOk').onclick=()=>{v.anul=true; v.motivo=$('#mot').value.trim()||'Sin motivo especificado'; o.hidden=true; render(); toast('Boleta '+v.nro+' anulada');};
}

let tT; function toast(m){const t=$('#toast'); if(!t) return; t.textContent=m; t.classList.add('on'); clearTimeout(tT); tT=setTimeout(()=>t.classList.remove('on'),2300);}
function reset(){ ventas=JSON.parse(JSON.stringify(V)); rango='hoy'; q=''; fpm='todos'; sel=null; render(); }
$$('#tgRol button').forEach(b=>b.onclick=()=>{rol=b.dataset.v; $$('#tgRol button').forEach(x=>x.classList.toggle('on',x===b)); render();});
$$('#tgView button').forEach(b=>b.onclick=()=>{$$('#tgView button').forEach(x=>x.classList.toggle('on',x===b)); $('#stage').classList.toggle('mobile',b.dataset.v==='mobile');});
$('#btnReset').onclick=reset;
reset();
</script>
</body>
</html>
